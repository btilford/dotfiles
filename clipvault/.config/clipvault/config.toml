# clipvault config — see https://github.com/btilford/clipvault for full docs.
# All keys are optional; commented values below are the built-in defaults.

[storage]
# db_path = "~/.local/share/clipvault/db.sqlite3"
# image_dir = "~/.local/share/clipvault/images"
max_text_bytes = 1048576

[retention]
max_text_entries = 5000
max_image_entries = 10
max_file_entries = 10

[capture]
dedup_window_secs = 5

[filters]
# Block saving to history entirely. app_id/class match is case-insensitive
# exact match; content/title are regex, checked against the copied text /
# window title respectively. Clipboard offers tagged
# x-kde-passwordManagerHint (KeePassXC and similar) are always skipped
# regardless of these filters.
apps = []
content_regex = []
title_regex = []

[llm]
# Pipe an entry through an LLM harness; output becomes a new entry + clipboard.
# Harnesses "claude" (claude -p, stdin) and "opencode" (opencode run {prompt})
# are built in. Prompt files live in ~/.config/clipvault/prompts/.
default_harness = "claude"
copy_result = false
insert_result = false
# mode = "tmux" defaults every prompt to an interactive detached tmux session
# (no output capture); mode = "capture" grabs stdout and routes it per
# copy_result/insert_result. A per-prompt `mode` pins that prompt — `t` in
# the TUI picker can't push a capture-pinned prompt into tmux.
mode = "tmux"
timeout_secs = 120

# Web-capable variant of the built-in "claude" harness. Plain `claude -p` runs
# headless with no tool grants, so anything that must fetch a URL just refuses
# ("WebFetch needs permission"). This grants only WebFetch — scoped, not
# --dangerously-skip-permissions. argv_tmux stays interactive `claude` so a tmux
# run can still prompt for anything else it wants.
[[llm.harnesses]]
id = "claude-web"
label = "Claude CLI (WebFetch)"
argv = ["claude", "-p", "--allowedTools", "WebFetch"]
argv_tmux = ["claude"]

# Local content only (code / file paths / files). URLs go to summarize-url below,
# which needs a fetch-capable harness — keeping them split avoids a capture run
# that silently refuses because it can't reach the network.
[[llm.prompts]]
id = "summarize"
label = "Summarize"
file = "prompts/summarize.md"
categories = ["code", "file-path", "files"]

insert_result = true
copy_result = true
mode = "capture"

[[llm.prompts]]
id = "summarize-url"
label = "Summarize this URL"
file = "prompts/summarize-url.md"
categories = ["url"]
harness = "claude-web"
insert_result = true
copy_result = true
mode = "capture"

[[llm.prompts]]
id = "explain-code"
label = "Explain this code"
file = "prompts/explain-code.md"
categories = ["code", "file-path", "files"]
# capture + insert so the answer is actually kept and can be shown back in the GUI.
# Without insert_result the harness output is captured and then discarded (the `llm`
# IPC op only returns entry_id/tmux_session, never the text), so there'd be nothing
# to display. copy_result stays false: explaining shouldn't clobber the clipboard.
insert_result = true
mode = "capture"

[[llm.prompts]]
id = "research-url"
label = "Research this URL"
file = "prompts/research-url.md"
categories = ["url"]


[[llm.prompts]]
id = "implement-plan"
label = "Implement this plan"
file = "prompts/implement-plan.md"
categories = ["file-path", "text", "code", "files"]

[[llm.prompts]]
id = "execute-task"
label = "Execute this task"
file = "prompts/execute-task.md"
categories = ["file-path", "text", "code", "files"]

[[llm.prompts]]
id = "vault-ingest"
label = "Ingest to vault"
file = "prompts/vault-ingest.md"
categories = ["file-path", "text", "code", "url", "files"]
