format = """
[░▒▓](#d2aea3)\
[ \uf31e ](bg:#d2aea3 fg:#0c0c09)\
[](bg:#f09f76 fg:#d2aea3)\
$directory\
[](fg:#f09f76 bg:#604239)\
$git_branch\
$git_status\
[](fg:#604239 bg:#362721)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#362721 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e5e5e5 bg:#f09f76"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#f09f76 bg:#604239)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#f09f76 bg:#604239)]($style)'

[nodejs]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#f09f76 bg:#362721)]($style)'

[rust]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#f09f76 bg:#362721)]($style)'

[golang]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#f09f76 bg:#362721)]($style)'

[php]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#f09f76 bg:#362721)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#cba9a0 bg:#30221d)]($style)'
