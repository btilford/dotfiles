set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'omerxx/tmux-floax'

# ── Terminal ───────────────────────────────────────────────────────────────────
set -g default-terminal 'tmux-256color'
set -as terminal-features ",*:RGB"
# Cursor shape passthrough: lets nvim switch between block/beam per mode
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g allow-passthrough on

# ── Core behaviour ─────────────────────────────────────────────────────────────
set -g mouse on
set -g mode-keys vi
set -g history-limit 50000
set -g detach-on-destroy off
set -g focus-events on          # required for nvim autoread / FocusGained events
set -g escape-time 10           # reduce esc delay for nvim (tmux-sensible sets 500ms)
set -g display-time 4000
set -g status-interval 5

# ── Activity ───────────────────────────────────────────────────────────────────
set -g monitor-activity on
set -g visual-activity off      # flash is distracting; bell only

# ── Clipboard (OS-conditional) ─────────────────────────────────────────────────
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
}

# ── Copy mode ─────────────────────────────────────────────────────────────────
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi P send -X paste-buffer

# ── Keybindings ───────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

bind-key C-e run-shell "edit-output.sh"

# ── Pane navigation (prefix + hjkl as fallback; C-hjkl handled by tmux.nvim) ──
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# ── tmux.nvim ─────────────────────────────────────────────────────────────────
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'

# ── Catppuccin ────────────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# Override pane border colors before catppuccin loads (it uses -ogq: won't overwrite)
set -g @catppuccin_pane_border_style 'fg=##3d1f00'
set -g @catppuccin_pane_active_border_style 'fg=##FF6600'
run ~/.tmux/plugins/tmux/catppuccin.tmux

# ── Pane focus (mirrors hyprland: orange active, dim inactive) ────────────────
set -g pane-border-lines heavy
set -g window-style 'fg=#585555,bg=default'
set -g window-active-style 'fg=#D4D1D1,bg=default'

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -agF status-right "#{E:@catppuccin_status_directory}"

# ── sessionx (disabled) ───────────────────────────────────────────────────────
# set -g @sessionx-bind ''
# set -g @sessionx-custom-paths '~/dotfiles/,~/Documents/personal-notes/notes'
# set -g @sessionx-custom-paths-subdirectories 'false'
# set -g @sessionx-fzf-builtin-tmux 'on'

# ── extended keys ──────────────────────────────────────────────────────────────
set -g extended-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u

# Needs to be last
run ~/.tmux/plugins/tpm/tpm
