set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'omerxx/tmux-floax'
# Superseded by `workmux sidebar` (see the Agents section below).
#
# Commenting this out does NOT disable the plugin: tpm sources every directory
# under ~/.tmux/plugins and ignores this list, so tmux-agents-mon keeps loading,
# rebinding keys and starting its daemon until the directory itself is removed.
# The line is commented only so tpm stops *reinstalling* it. Our bindings are set
# after `run tpm` for exactly this reason.
# set -g @plugin 'snirt/tmux-agents-mon'
# ── Terminal ───────────────────────────────────────────────────────────────────
set -g default-terminal 'tmux-256color'
set -as terminal-features ",*:RGB"
# Cursor shape passthrough: lets nvim switch between block/beam per mode
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g allow-passthrough on

# ── Window title ───────────────────────────────────────────────────────────────
# Terminals report their title to the compositor, which is where clipborg reads
# window_title from when it captures a clip. Without this, every clip from any
# tmux session is attributed to a bare "tmux" and they all collapse into one
# node in clipborg's tree view. Carrying the session name makes them group.
set -g set-titles on
set -g set-titles-string '#S — #W'

# ── Core behaviour ─────────────────────────────────────────────────────────────
set -g mouse on
set -g mode-keys vi
set -g history-limit 50000
set -g detach-on-destroy off
set -g focus-events on          # required for nvim autoread / FocusGained events
set -g escape-time 10           # reduce esc delay for nvim (tmux-sensible sets 500ms)
set -g display-time 4000
set -g status-interval 5

# ── Activity ───────────────────────────────────────────────────────────────────
set -g monitor-activity on
set -g visual-activity off      # flash is distracting; bell only

# ── Clipboard ─────────────────────────────────────────────────────────────────
# tmux-yank handles mouse-select → clipboard; set yank_action to copy-pipe so it
# uses the OS clipboard without also jumping to the bottom of the buffer
set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse on

# ── Copy mode ─────────────────────────────────────────────────────────────────
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi P send -X paste-buffer

# ── Keybindings ───────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# prefix + E → open the pane's output/history in nvim (was C-e). Safe pre-tpm:
# no plugin binds E once workmux's diff popup moves to D (see the Agents section).
bind-key E run-shell "edit-output.sh"

# ── Code review popups (cwd) ────────────────────────────────────────────────────
# Full-screen TUIs → popup, matching the clipborg/workmux idiom. -d pins the popup
# to the active pane's dir so both act on the current repo. Guarded: bind only
# where the tool exists.
#   prefix + P  tuicr — review current repo (auto-detects GitHub/GitLab remote)
#   prefix + G  gh dash — GitHub PR/issue dashboard
if-shell 'command -v tuicr' "bind-key P display-popup -E -w 90% -h 85% -d '#{pane_current_path}' 'tuicr'"
if-shell 'command -v gh' "bind-key G display-popup -E -w 90% -h 85% -d '#{pane_current_path}' 'gh dash'"

# clipborg clipboard history in a floating popup; -E closes it when the TUI
# exits (Enter copies + quits, q quits), so copy-and-dismiss is one keypress.
# Guarded: clipborg is Linux-only, so only bind where it's installed.
if-shell 'command -v clipborg' "bind-key v display-popup -E -w 80% -h 75% 'clipborg tui'"

# ── Pane navigation ───────────────────────────────────────────────────────────
# -n bindings handle C-hjkl from plain shell panes; nvim handles its own side
# via tmux.nvim's lua plugin which calls back into tmux via the socket
bind-key -n C-h select-pane -L
bind-key -n C-l select-pane -R
bind-key -n C-k select-pane -U
bind-key -n C-j select-pane -D
# prefix + hjkl as fallback
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# ── tmux.nvim ─────────────────────────────────────────────────────────────────
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle false
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'

# ── Catppuccin ────────────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# Override pane border colors before catppuccin loads (it uses -ogq: won't overwrite)
set -g @catppuccin_pane_border_style 'fg=##3d1f00'
set -g @catppuccin_pane_active_border_style 'fg=##FF6600'

# ── Host/OS-specific overrides: PRE slot ───────────────────────────────────────
# Uncommitted, per-machine (mirrors fish conf.d/local.fish). Loads here — after the
# repo's own settings but BEFORE any plugin loads — so it can override plain options
# AND plugin @options (catppuccin flavor, @tmux-nvim-navigation-cycle, disable a
# plugin, etc.). For overriding what a plugin sets, use the POST slot after tpm.
if-shell '[ -r ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'

# Load whichever files this catppuccin/tmux version ships — the plugin's file
# layout differs across versions/platforms, so guard each and skip missing ones
# silently instead of erroring at startup.
if-shell '[ -r ~/.tmux/plugins/tmux/catppuccin.tmux ]' 'run ~/.tmux/plugins/tmux/catppuccin.tmux'
if-shell '[ -r ~/.tmux/plugins/tmux/catppuccin_options_tmux.conf ]' 'source-file ~/.tmux/plugins/tmux/catppuccin_options_tmux.conf'
if-shell '[ -r ~/.tmux/plugins/tmux/catppuccin_tmux.conf ]' 'source-file ~/.tmux/plugins/tmux/catppuccin_tmux.conf'

# ── Pane focus (mirrors hyprland: orange active, dim inactive) ────────────────
set -g pane-border-lines heavy
set -g window-style 'fg=#585555,bg=default'
set -g window-active-style 'fg=#D4D1D1,bg=default'

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -agF status-right "#{E:@catppuccin_status_directory}"
# NOTE: `set -g` (not `-ag`) resets status-right, so this discards the catppuccin
# modules set on the five lines above — pre-existing, left as-is to avoid changing
# the status bar's appearance while swapping the agent monitor out. Dropping the
# `#{agents_mon}` interpolation is the only change here; workmux's sidebar is a
# pane, not a status-bar module, so it needs no slot.
set -g status-right '%H:%M'


# ── sessionx (disabled) ───────────────────────────────────────────────────────
# set -g @sessionx-bind ''
# set -g @sessionx-custom-paths '~/dotfiles/,~/Documents/personal-notes/notes'
# set -g @sessionx-custom-paths-subdirectories 'false'
# set -g @sessionx-fzf-builtin-tmux 'on'

# ── extended keys ──────────────────────────────────────────────────────────────
set -g extended-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u


# --- Agents
# workmux's sidebar replaces tmux-agents-mon. It has no auto-start setting and is
# a *toggle*, so it must not be launched from a bare `run-shell` here: this file is
# re-sourced by `prefix + r` (line 52), and each reload would flip it back off.
# A binding is what upstream documents.
#
# Keys were remapped off the old agents-mon set (A/e/E) to free E for the nvim
# output popup and group the review popups: A→b (sidebar), E→D (diff). `e` stays.
#
#   prefix + b  toggle the sidebar (a pane in every window; j/k move, Enter jumps,
#               f filters to this session, q quits)
#   prefix + e  dashboard in a popup — full-screen TUI, so it gets a popup rather
#               than a pane, matching the clipborg binding above
#   prefix + D  dashboard straight into the diff view for the current worktree
#               (overrides tmux's default D = choose-client, which we don't use)
#
# These are bound AFTER `run tpm` below, not here. TPM sources every plugin
# directory it finds on disk — it does NOT honour the `@plugin` list — so a plugin
# that binds the same key wins whenever it loads later. Verified: a config
# containing only `run tpm`, with zero `@plugin` lines, still binds `prefix + A`
# to tmux-agents-mon. Commenting out a `@plugin` line disables nothing; the
# directory has to go.

# Previous plugin's settings, kept for reference until the plugin is deleted:
# set -g @agents-mon-key 'A'          # toggle keybinding (prefix table)
# set -g @agents-mon-popup-key 'e'    # optional: dedicated key that always opens the popup
# set -g @agents-mon-width '30'       # width (defaults: split 30, popup 40)
# set -g @agents-mon-display 'left split'  # make the main key open a popup (default: left split)
# set -g @agents-mon-height '15'      # fixed popup height (otherwise sized to the agent list, min. 15)
# set -g @agents-mon-hide-windows 'agents*'  # hide matching windows from the prefix+w picker
#                                     # (one fnmatch pattern; set to '' to restore the default picker)
# tpm loads all @plugin's above — must run after the local PRE include so a
# machine can set plugin @options (see the pre-plugin override slot above).
run ~/.tmux/plugins/tpm/tpm

# ── Agent monitor bindings (must follow tpm — see the Agents section above) ────
if-shell 'command -v workmux' "bind-key b run-shell 'workmux sidebar'"
if-shell 'command -v workmux' "bind-key e display-popup -E -w 90% -h 85% 'workmux dashboard'"
if-shell 'command -v workmux' "bind-key D display-popup -E -w 90% -h 85% 'workmux dashboard --diff'"

# ── Host/OS-specific overrides: POST slot ──────────────────────────────────────
# Uncommitted, per-machine. Loads dead last, after every plugin — use this only to
# override bindings/status/colors that the plugins themselves set. For plain
# options and plugin @options, prefer the PRE slot above (it runs before plugins).
if-shell '[ -r ~/.tmux.local.post.conf ]' 'source-file ~/.tmux.local.post.conf'
