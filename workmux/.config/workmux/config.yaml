# workmux project configuration
# For global settings, edit ~/.config/workmux/config.yaml
# All options below are commented out - uncomment to override defaults.

# -------------------------------------------------------------------------------
# Appearance
# -------------------------------------------------------------------------------

# Nerd Font glyphs in the dashboard and sidebar. workmux prompts for this on first
# run and writes the answer to this file itself — which, since ~/.config/workmux is
# a stow symlink, means it appends into the repo. Committed deliberately rather
# than gitignored: it is a real setting and the terminal font is the same on every
# host here. Recorded in its documented section instead of the file's tail, where
# the tool dropped it.
nerdfont: true

# Color scheme for the dashboard. Press T (shift+t) in the dashboard to cycle.
# Options: default, emberforge, glacier-signal, obsidian-pop, slate-garden,
#          phosphor-arcade, lasergrid, mossfire, night-sorbet, graphite-code,
#          festival-circuit, teal-drift
# theme: default
#
# Or with explicit dark/light mode (otherwise auto-detected from terminal):
# theme:
#   scheme: emberforge
#   mode: dark

# -------------------------------------------------------------------------------
# Git
# -------------------------------------------------------------------------------

# The primary branch to merge into.
# Default: Auto-detected from remote HEAD, falls back to main/master.
# main_branch: main

# Default base branch/commit to branch from when creating new worktrees.
# Use "auto" to branch from main_branch or the locally detected main/master branch.
# The --base CLI flag always overrides this.
# Default: The currently checked out branch.
# base_branch: auto

# Default merge strategy for `workmux merge`.
# Options: merge (default), rebase, squash
# CLI flags (--rebase, --squash) always override this.
#
# Set explicitly to match worktrunk's [merge] defaults (squash = true), which are
# on unless disabled. Leaving this unset would silently diverge: workmux defaults
# to a plain merge commit, so the same branch merged with one tool and then the
# other would land differently shaped history.
merge_strategy: squash

# Keep the worktree, window, and branch after `workmux merge` by default.
# Keep and cleanup CLI flags always override this.
#
# false mirrors worktrunk's [merge] remove = true — the worktree and its window go
# away once the branch has landed. workmux's own default is the opposite.
merge_keep: false

# -------------------------------------------------------------------------------
# Naming & Paths
# -------------------------------------------------------------------------------

# Directory where worktrees are created.
# Can be relative to repo root or absolute. Supports `~` for home directory
# and `{project}` for the main worktree's directory name, so a global config
# can namespace each repo, e.g. `~/.workmux/{project}`.
# Default: Sibling directory '<project>__worktrees'.
#
# Shares one root with worktrunk. `{project}` is the main worktree's directory
# name, which equals worktrunk's `{{ repo }}`, and the leaf handle is the branch
# with slashes turned to dashes, matching `{{ branch | sanitize }}` — so
# `~/worktrees/{project}` here and `~/worktrees/{{ repo }}/{{ branch | sanitize }}`
# in worktrunk's config.toml resolve to the same path for the same branch.
# worktrunk was moved to repo-first to meet workmux, which cannot express
# branch-first (upstream #148 shipped only `{project}`; #161 is still open).
worktree_dir: ~/worktrees/{project}

# Strategy for deriving names from branch names.
# Options: full (default), basename (part after last '/').
# worktree_naming: basename

# Prefix added to worktree directories and tmux window names.
# worktree_prefix: ""

# Prefix for tmux window names.
# Default: "wm-"
# window_prefix: "wm-"

# -------------------------------------------------------------------------------
# Tmux
# -------------------------------------------------------------------------------

# Mode for tmux operations: window (default) or session.
# - window: Create windows within the current tmux session
# - session: Create tmux sessions for each worktree
#
# Session, to match worktrunk's post-start hook, which builds a dedicated session
# per worktree rather than a window in the current one.
mode: session

# Base ref for new worktrees. `auto` resolves the effective main branch from LOCAL
# git state only — verified: it reports `master`, not `origin/master`, and workmux
# never fetches. workmux also has no pre-create hook (only post_create/pre_merge/
# pre_remove, all of which run too late), so unlike worktrunk's [pre-switch] there
# is no in-tool seam to refresh first. A stale local master therefore yields a
# stale worktree; refresh with `git fetch` and pass `--base origin/master`, or use
# a shell wrapper. Left on `auto` rather than hardcoding `origin/master`, which
# would break every repo whose default branch is `main`.
base_branch: auto

# Placement for new tmux windows in window mode.
# Options: after_current (default), rightmost
# window_placement: rightmost

# Custom tmux pane layout (mutually exclusive with 'windows').
#
# This MUST be declared to get a single pane. workmux's built-in default is a
# TWO-pane layout (agent + a shell running `clear`), so leaving this key out — or
# commenting it back out — does not remove the split, it restores it. There was
# never an active `panes:` block here to delete; the reference sample below was
# always commented, which is exactly why the split looked like it came from
# nowhere.
#
# `<agent>` is workmux's placeholder for the resolved agent command, so this
# stays correct whichever `agents:` profile a session is launched with.
#
# Caveat: unlike `post_create` and `files.copy`, `panes` does NOT merge and does
# not honour the `<global>` token — a project `.workmux.yaml` that declares its
# own `panes` replaces this wholesale.
panes:
  - command: "<agent>"
    focus: true

# Reference sample, from `workmux config reference`:
#   - command: pnpm install
#     name: deps
#     focus: true
#   - split: horizontal
#   - command: clear
#     split: vertical
#     size: 5
#   - command: just test --watch
#     split: stacked  # Zellij only

# Multiple windows per session (session mode only, mutually exclusive with 'panes').
# Each window can have its own pane layout. Unnamed windows get tmux's
# automatic naming based on the running command.
# windows:
#   - name: editor
#     panes:
#       - command: <agent>
#         focus: true
#       - split: horizontal
#         size: 20
#   - name: tests
#     panes:
#       - command: just test --watch
#   - panes:
#       - command: tail -f app.log

# Auto-apply agent status icons to tmux window format.
# Default: true
# status_format: true

# Custom icons for agent status display.
# status_icons:
#   working: "🤖"
#   waiting: "💬"
#   done: "✅"

# -------------------------------------------------------------------------------
# Agent & AI
# -------------------------------------------------------------------------------

# Agent command for '<agent>' placeholder in pane commands.
# Default: "claude"
# agent: claude

# LLM-based branch name generation (`workmux add -A`).
# auto_name:
#   model: "gpt-4o-mini"
#   system_prompt: "Generate a kebab-case git branch name."
#   background: true  # Always run in background when using --auto-name

# Named agent profiles. Global-only — workmux ignores an `agents:` block in a
# project .workmux.yaml. Reference one with `agent: <name>`, `workmux add -a <name>`,
# `<agent:<name>>` in a pane command, or `vdb spawn launch --workmux-agent <name>`.
# Structured profiles take `type`, `command`, `args`, `env`.
#
# Why this exists at all: `workmux add` takes an agent NAME, not an argv, so on the
# workmux path `vdb spawn`'s --model-tier / --permission / --remote-control are
# silently dropped (spawn.sh warns and names this block as the fix). A profile is the
# only way to pin them there. The worktrunk path threads the same flags directly and
# needs no profile.
# One profile per model tier, named to match vault-db's --model-tier map
# (1 = haiku, 2 = sonnet, 3 = opus) so a spawn can be moved between tiers by
# swapping only --workmux-agent. All three are otherwise identical: differing on
# anything but --model would make a tier change silently change permissions too.
#
# Unattended means an MR-stack loop launches these per ticket with no human at the
# keyboard.
#
# --permission-mode auto approves every tool call but KEEPS the background safety
# checks. It is not `--dangerously-skip-permissions`, which disables them outright
# and which vdb's spawn.sh refuses on a host worktree. acceptEdits is the wrong
# choice here for a specific reason: it auto-approves edits but still prompts on
# Bash, so an overnight run stalls on the first gradle/git call and the supervising
# loop spends the night watching a frozen prompt.
#
# --remote-control's name is optional; omitted, workmux cannot know the per-ticket
# session name, so claude generates one prefixed with the hostname. That is enough
# to reach the session from claude.ai/code or the mobile app.
#
# Aliases verified 2026-07-29 against the installed claude, since a bad --model is
# only discovered when a spawn dies:
#
#   opus   -> claude-opus-5              1M ctx   64K out
#   sonnet -> claude-sonnet-5            1M ctx   64K out
#   haiku  -> claude-haiku-4-5-20251001  200K ctx 32K out
#
# `haiku` resolves but is NOT listed in `claude --help`, which documents only fable,
# opus and sonnet — treat it as undocumented and re-verify after a claude upgrade.
# Note the context asymmetry: haiku has 1/5th the window, so a task whose prompt is a
# handoff doc plus a repo survey can fit on opus/sonnet and overflow on haiku. That is
# a capability difference in the profile, not in the work.
agents:
  unattended-opus:
    type: claude
    command: claude
    args:
      - --model
      - opus
      - --permission-mode
      - auto
      - --remote-control
  unattended-sonnet:
    type: claude
    command: claude
    args:
      - --model
      - sonnet
      - --permission-mode
      - auto
      - --remote-control
  unattended-haiku:
    type: claude
    command: claude
    args:
      - --model
      - haiku
      - --permission-mode
      - auto
      - --remote-control

# -------------------------------------------------------------------------------
# Hooks
# -------------------------------------------------------------------------------

# Commands to run in new worktree before tmux window opens.
# These block window creation - use for short tasks only.
# Use "<global>" to inherit from global config.
# Set to empty list to disable: `post_create: []`
#
# Same helper worktrunk calls from its [post-start] env hook — copying .env and
# friends from the primary worktree, then delegating to `mise run setup:worktree`
# when the project defines it. The script is tool-agnostic (it finds the primary
# via `git worktree list` and works from $PWD), so sharing it is what actually
# keeps the two tools in step: fix the behaviour once, both inherit it.
post_create:
  - wt-setup-worktree

# Commands to run before merging (e.g., linting, tests).
# Aborts the merge if any command fails.
# Use "<global>" to inherit from global config.
# Environment variables available:
#   - WM_BRANCH_NAME: The name of the branch being merged
#   - WM_TARGET_BRANCH: The name of the target branch (e.g., main)
#   - WM_WORKTREE_PATH: Absolute path to the worktree
#   - WM_PROJECT_ROOT: Absolute path of the main project directory
#   - WM_HANDLE: The worktree handle/window name
# pre_merge:
#   - "<global>"
#   - cargo test
#   - cargo clippy -- -D warnings

# Commands to run before worktree removal (during merge or remove).
# Useful for backing up gitignored files before cleanup.
# Default: Auto-detects Node.js projects and fast-deletes node_modules.
# Set to empty list to disable: `pre_remove: []`
# Environment variables available:
#   - WM_HANDLE: The worktree handle (directory name)
#   - WM_WORKTREE_PATH: Absolute path of the worktree being deleted
#   - WM_PROJECT_ROOT: Absolute path of the main project directory
# Mirrors worktrunk's [pre-remove] sync hook — invoked identically, with no
# NONINTERACTIVE=1. wt-sync-primary handles the missing TTY itself now: it prompts
# only when stdin is a terminal and otherwise declines, so the hook cannot hang or
# fail here. NONINTERACTIVE=1 would mean the opposite of what it looks like — it is
# the opt-in to APPLY the patch unattended, which would both duplicate changes that
# reach primary through a normal merge and make workmux behave differently from
# worktrunk on the same removal.
#
# Note workmux has no post_remove hook, so worktrunk's prune step has no
# counterpart — harmless under the repo-first layout, where the parent dir is
# reused by the next branch.
pre_remove:
  - wt-sync-primary

# -------------------------------------------------------------------------------
# Files
# -------------------------------------------------------------------------------

# File operations when creating a worktree.
# files:
#   # Files to copy (useful for .env files that need to be unique).
#   copy:
#     - .env.local
#
#   # Files/directories to symlink (saves disk space, shares caches).
#   # Default: None.
#   # Use "<global>" to inherit from global config.
#   symlink:
#     - "<global>"
#     - node_modules

# -------------------------------------------------------------------------------
# Dashboard
# -------------------------------------------------------------------------------

# Actions for dashboard keybindings (c = commit, m = merge).
# Values are sent to the agent's pane. Use ! prefix for shell commands.
# Preview size (10-90): larger = more preview, less table. Use +/- keys to adjust.
# dashboard:
#   commit: "Commit staged changes with a descriptive message"
#   merge: "!workmux merge"
#   preview_size: 60

# -------------------------------------------------------------------------------
# Sidebar
# -------------------------------------------------------------------------------

sidebar:
   # Position: left (default) or top.
   position: left

   # Left sidebar width: absolute columns or percentage of terminal width.
   # Default: "10%" (clamped to 25-50 columns).
   # Explicit values are not clamped (minimum 10 columns).
   width: 50       # absolute columns
   # width: "15%"  # percentage of terminal width

   # Top bar height in rows.
   height: 3

   # Layout mode for the left sidebar: "compact" or "tiles" (cards).
   # Default: "tiles". Can be toggled at runtime with 'v' key.
   layout: tiles

   horizontal:
     item_width: 24  # horizontal chip width in columns, clamped 12-80

   templates:
     horizontal:
       - "{status_icon} {primary} {pane_suffix} {fill} {elapsed}"
       - "{secondary} {fill} {git_stats}"
       - "{pane_title}"

# -------------------------------------------------------------------------------
# Sandbox
# -------------------------------------------------------------------------------

# sandbox:
#   enabled: false
#   backend: lima
#   # host_commands: ["just", "cargo", "npm"]
#   # container:
#   #   runtime: docker          # docker | podman | apple-container
#   #   # memory: 16G            # VM memory limit (apple-container default: 16G)
#   #   # cpus: 4                # VM CPU count (only passed when set)
#   #   # OCI runtime to run under (docker/local Podman --runtime). Unset omits
#   #   # the flag and uses the engine's configured default.
#   #   # Set to e.g. "kata" for VM-based isolation (runtime must be installed
#   #   # and registered). GLOBAL-ONLY: ignored in a project .workmux.yaml.
#   #   # oci_runtime: kata
#   #   # Extra capabilities / security options (docker/podman --cap-add /
#   #   # --security-opt). Empty by default and GLOBAL-ONLY. Permissive values
#   #   # weaken host-kernel container isolation unless paired with a VM runtime.
#   #   # Main use: docker-in-docker under oci_runtime: kata.
#   #   # cap_add: [ALL]
#   #   # security_opt: [seccomp=unconfined, apparmor=unconfined, systempaths=unconfined]
#   #   # Mask files out of the worktree bind mounts (paths relative to the
#   #   # worktree root). Each listed file is shadowed by /dev/null so the
#   #   # sandboxed agent cannot read it. Missing files are skipped.
#   #   # GLOBAL-ONLY: ignored when set in a project .workmux.yaml.
#   #   # excluded_files:
#   #   #   - .env
#   #   #   - .env.local
#   # lima:
#   #   isolation: project
#   #   cpus: 4
#   #   memory: 4GiB
#   #   # Custom provision script (runs once on VM creation, as user).
#   #   # Use sudo for system commands.
#   #   # provision: |
#   #   #   sudo apt-get install -y ripgrep fd-find jq
#   # Extra mount points (read-only by default).
#   # Supports simple paths or detailed specs with guest_path and writable.
#   # extra_mounts:
#   #   - ~/my-notes
#   #   - host_path: ~/data
#   #     guest_path: /mnt/data
#   #     writable: true

# Named pane layouts, selected with `workmux add -l <name>`. Global so every repo
# gets them without a per-project .workmux.yaml.
layouts:
  dev:
    panes:
      - {command: <agent>, name: agent, focus: true}
      - {name: shell, split: horizontal, size: 25}
