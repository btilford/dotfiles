stages: [lint]

# NOTE: the self-hosted runner cannot reach api.github.com (rate-limited) or
# sigstore.dev, so mise's aqua/ubi tool installs fail there. CI therefore uses
# official tool-bundled images for the highest-value gates. The remainder
# (json/nu/fish/lua + formatters) runs locally via `mise run lint` and the hk
# pre-commit hook, and on GitHub Actions via .github/workflows/lint.yml,
# where GitHub IS reachable and mise can install the full toolchain.
#
# Images are pinned by digest, not by tag. `:stable` and `:latest` are moving
# targets — an upstream rebuild can turn a green pipeline red with no commit
# here, and there is no record of which build actually gated a given merge.
# To update one: `docker pull <image>:<tag>` then
# `docker inspect --format='{{index .RepoDigests 0}}' <image>:<tag>`.

# When pipelines run. Until 2026-07-27 both jobs were gated on
# `$CI_COMMIT_BRANCH == "master"`, which is unset on merge-request pipelines —
# so CI was a post-merge canary that could report master was broken but could
# never stop a branch from breaking it. Now every branch and every MR is gated.
#
# The middle rule is the load-bearing one: without it, pushing to a branch that
# has an open MR builds TWICE (once as a branch pipeline, once as an MR
# pipeline). It suppresses the branch pipeline in that case and lets the MR
# pipeline — the one attached to the thing being reviewed — be the survivor.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

lint:shellcheck:
  stage: lint
  # koalaman/shellcheck-alpine:stable
  image: koalaman/shellcheck-alpine@sha256:c82fe42504fbc9fc68f15d36638e5ee2324ebb8b94e96a3c4e395bf361c49183
  script:
    # Error severity only — vendored hyprland scripts carry heavy style noise.
    # File selection is mise-scripts/shell-files.sh, the same selector `mise run
    # lint:shell` uses, so this job and the local task cannot diverge. It is POSIX
    # sh using only find/grep precisely because this image ships no git.
    - ./mise-scripts/shell-files.sh | xargs -r shellcheck --severity=error -e SC1090,SC1091,SC2148

lint:private:
  stage: lint
  # No mise/tooling in CI: the script is POSIX sh using only git/grep/sed, the same
  # constraint mise-scripts/shell-files.sh works under. No local.env here, so only the
  # generic pattern half runs — the value half is a developer-machine gate.
  image:
    # alpine/git because the script needs BOTH git and sh; the shellcheck image has
    # no git. entrypoint must be cleared — alpine/git's entrypoint is `git`, so a
    # plain script line becomes `git sh -c …` and fails with
    # "git: 'sh' is not a git command". Digest-pinned like every other image here.
    name: alpine/git@sha256:b4d933c7185b5cc9da7704f2c6e19d477f935ea31a50d9a017ffce2bbd1109a3
    entrypoint: [""]
  script:
    - ./mise-scripts/no-local-values.sh --all

lint:secrets:
  stage: lint
  image:
    # ghcr.io/betterleaks/betterleaks:v1.8.1 — betterleaks replaced gitleaks on
    # 2026-08-24 (same author; reads this repo's .betterleaks.toml unchanged).
    name: ghcr.io/betterleaks/betterleaks@sha256:8b9d12db5e11ca798029da44923503de5d8cfff6992cffaaa6722fbeb9fc7797
    entrypoint: [""]
  script:
    # --redact: a CI job log is a published surface, so a finding must name the
    # file and line without printing the value. Same asymmetry no-local-values.sh
    # already uses (--all withholds the line, staged mode prints it).
    - betterleaks dir . -c .betterleaks.toml --no-banner --redact

# Verification, not detection. MANUAL and allow_failure on purpose: verifying a
# credential means outbound calls to arbitrary providers, and this runner cannot
# reach the public internet freely (the same restriction that keeps mise's
# aqua/ubi installs out of this file). The real gate is the GitHub workflow's
# secrets-live job; this is here so the two surfaces stay legible to each other
# rather than silently diverging. See CLAUDE.md "Linting & CI".
audit:secrets-live:
  stage: lint
  when: manual
  allow_failure: true
  image:
    # trufflesecurity/trufflehog:latest — 3.97.0
    name: trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - trufflehog git file://. --results=verified --fail --no-update

lint:yaml:
  stage: lint
  image:
    # pipelinecomponents/yamllint:latest — yamllint 1.37.1
    name: pipelinecomponents/yamllint@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d
    entrypoint: [""]
  script:
    # Same selector as `mise run lint:yaml` and the GitHub workflow. Like the
    # shellcheck image this one ships no git, hence the find-based script.
    # Rules come from .yamllint (relaxed base, style noise off, real errors on).
    - ./mise-scripts/yaml-files.sh | xargs -r yamllint
