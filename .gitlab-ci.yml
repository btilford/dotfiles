stages: [lint]

lint:shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - find . -type f \( -name "*.sh" -o -name "*.bash" \) -not -path "./.git/*"
        | xargs shellcheck -e SC1090,SC1091,SC2148 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
