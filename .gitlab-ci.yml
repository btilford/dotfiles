stages: [lint]

# NOTE: the self-hosted runner cannot reach api.github.com (rate-limited) or
# sigstore.dev, so mise's aqua/ubi tool installs fail there. CI therefore uses
# official tool-bundled images for the two highest-value gates. The full suite
# (yaml/json/nu/fish + formatters) runs locally via `mise run lint` and the
# lefthook pre-commit hook, where GitHub is reachable.

# When pipelines run. Until 2026-07-27 both jobs were gated on
# `$CI_COMMIT_BRANCH == "master"`, which is unset on merge-request pipelines —
# so CI was a post-merge canary that could report master was broken but could
# never stop a branch from breaking it. Now every branch and every MR is gated.
#
# The middle rule is the load-bearing one: without it, pushing to a branch that
# has an open MR builds TWICE (once as a branch pipeline, once as an MR
# pipeline). It suppresses the branch pipeline in that case and lets the MR
# pipeline — the one attached to the thing being reviewed — be the survivor.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

lint:shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    # Error severity only — vendored hyprland scripts carry heavy style noise.
    # File selection is scripts/shell-files.sh, the same selector `mise run
    # lint:shell` uses, so this job and the local task cannot diverge. It is POSIX
    # sh using only find/grep precisely because this image ships no git.
    - ./scripts/shell-files.sh | xargs -r shellcheck --severity=error -e SC1090,SC1091,SC2148

lint:secrets:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks dir . -c .gitleaks.toml --no-banner
