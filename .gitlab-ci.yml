stages: [lint]

# NOTE: the self-hosted runner cannot reach api.github.com (rate-limited) or
# sigstore.dev, so mise's aqua/ubi tool installs fail there. CI therefore uses
# official tool-bundled images for the two highest-value gates. The full suite
# (yaml/json/nu/fish + formatters) runs locally via `mise run lint` and the
# lefthook pre-commit hook, where GitHub is reachable.

lint:shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    # Error severity only — vendored hyprland scripts carry heavy style noise.
    # Exclude __sdkman-noexport-init.sh (zsh syntax) and RofiEmoji.sh (emoji data).
    - |
      find . -type f \( -name '*.sh' -o -name '*.bash' \) \
        -not -path './.git/*' \
        -not -name '__sdkman-noexport-init.sh' \
        -not -name 'RofiEmoji.sh' \
        -print0 \
        | xargs -0 shellcheck --severity=error -e SC1090,SC1091,SC2148
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

lint:secrets:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks dir . -c .gitleaks.toml --no-banner
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
