stages: [lint]

# Linters + tool versions are defined in mise.toml, shared with local dev.
# `mise run lint` fans out to shell/secrets/yaml/json/nu/fish gates.
lint:
  stage: lint
  image:
    name: jdxcode/mise:latest
    # Reset the image's `mise` entrypoint so GitLab's shell runs the scripts;
    # mise stays on PATH and is invoked explicitly below.
    entrypoint: [""]
  variables:
    # Keep mise's tool cache inside the project dir so GitLab can cache it.
    MISE_DATA_DIR: $CI_PROJECT_DIR/.mise-data
    MISE_YES: "1"
  cache:
    key: mise-tools-v1
    paths:
      - .mise-data/
  before_script:
    - mise trust --yes
    - mise install
  script:
    - mise run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
