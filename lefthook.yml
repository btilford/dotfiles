# Git hooks, managed via mise-installed lefthook.
# Install once per clone:  mise run hooks
# Formatters run on STAGED files only, then re-stage — no repo-wide reflow.

pre-commit:
  parallel: true
  commands:
    shfmt:
      glob: "*.{sh,bash}"
      run: shfmt -w -i 2 -ci -sr {staged_files}
      stage_fixed: true
    stylua:
      glob: "*.lua"
      # Same two exclusions as mise-scripts/lua-files.sh: the frozen colors.lua
      # seed and the wallust render template. Kept in step — see that script.
      #
      # LIST form, not a single "a|b" string. The string form is an unanchored
      # regex (unescaped dots) AND lefthook 2.1.10 ignores it entirely under
      # `--all-files` — verified: `lefthook run pre-commit --all-files
      # --command stylua` reformatted and auto-staged both files anyway. The
      # list form is matched as globs and holds under both staged and
      # --all-files runs.
      exclude:
        - "hyprland/.config/hypr/lua/colors.lua"
        - "wallust/.config/wallust/templates/colors-hyprland.lua"
      run: stylua {staged_files}
      stage_fixed: true
    taplo:
      glob: "*.toml"
      run: taplo fmt {staged_files}
      stage_fixed: true
    markdownlint:
      glob: "*.md"
      run: markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    fish-syntax:
      glob: "*.fish"
      run: 'for f in {staged_files}; do fish --no-execute "$f"; done'
    no-local-values:
      run: mise-scripts/no-local-values.sh
    # `git --staged`, not the deprecated `protect --staged` (hidden alias since
    # v8.19.0). Unredacted on purpose: author's own terminal, own content.
    gitleaks:
      run: gitleaks git --staged -c .gitleaks.toml --no-banner
    # Structural: a credential-named value must be a reference, not a literal.
    # Same script the lint task and the machine audit run, given {staged_files}.
    config-secret-refs:
      glob: "*.{json,jsonc,yaml,yml}"
      run: ./mise-scripts/config-secret-refs.py {staged_files}

# A commit message is published exactly like file content, and was ungated until
# now — pre-commit runs before the message exists, so nothing ever looked at it.
# {1} is the path to the message file.
commit-msg:
  commands:
    no-local-values:
      run: mise-scripts/no-local-values.sh --message {1}
