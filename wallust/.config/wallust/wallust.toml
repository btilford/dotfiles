# wallust configuration - adapted from JaKooLit/Hyprland-Dots

backend = "kmeans"
color_space = "labmixed"
palette = "softdark16"
threshold = 15
check_contrast = true

[templates]
hypr.template = 'colors-hyprland.lua'
hypr.target = '~/.config/hypr/lua/colors.lua'

rofi.template = 'colors-rofi.rasi'
rofi.target = '~/.config/rofi/wallust/colors-rofi.rasi'

waybar.template = 'colors-waybar.css'
waybar.target = '~/.config/waybar/wallust/colors-waybar.css'

ghostty.template = 'colors-ghostty.conf'
ghostty.target = '~/.config/ghostty/wallust.conf'

swaync.template = 'colors-swaync.css'
swaync.target = '~/.config/swaync/wallust/colors-wallust.css'

quickshell.template = 'colors-quickshell.json'
quickshell.target = '~/.config/quickshell/wallust/colors.json'

clipvault.template = 'colors-quickshell.json'
clipvault.target = '~/.config/clipvault/colors.json'
