# Tool + task manager for this repo — shared by CI and local dev.
#   mise install       install every linter/formatter below
#   mise run lint      run all CI gates (non-mutating)
#   mise run fmt       apply formatters (used by the pre-commit hook)
# See CLAUDE.md "Linting & formatting" for the design notes.

[settings]
# Route pipx packages (yamllint) through uv, so no separate pipx binary is
# needed in a minimal CI image.
pipx.uvx = true

[tools]
# Runtime — needed so the pipx (yamllint) backend resolves in a minimal CI
# image, not just on a dev box with system python.
#
# No node here on purpose: markdownlint-cli2 is installed globally by bun and
# declared in the metapac `core` group, so mise no longer needs a node runtime
# to resolve an npm-backend tool. bun owns global JS CLIs, uv owns Python ones.
python = "3.12"
uv = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"
gitleaks = "latest"
yamllint = "latest"
jq = "latest"
# ubi (direct GitHub binary) — aqua's lefthook build fails attestation in CI.
"ubi:evilmartians/lefthook" = "latest"
"ubi:nushell/nushell" = { version = "latest", exe = "nu" }

# ---------------------------------------------------------------------------
# CI gates — non-mutating. `mise run lint` runs them all.
# ---------------------------------------------------------------------------

[tasks.hooks]
description = "Install git hooks (lefthook) into this clone"
run = "lefthook install"

[tasks."setup:git-template"]
description = "Build ~/.local/share/git-template (init.templateDir) from the stowed templates"
# Per machine, and again after changing git/.config/git/templates/. Needed because
# git copies template entries as symlinks and stow makes every file a symlink —
# the generated dir holds real files so installed hooks don't dangle.
run = "git-template-sync"

[tasks."gen:luacheck-hl-std"]
description = "Regenerate the luacheck field spec for hyprland's `hl` global from its stubs"
# Run after a hyprland upgrade and commit the result: /usr/share/hypr/stubs/hl.meta.lua
# is regenerated per release, and a hand-maintained copy would drift silently.
run = "./mise-scripts/gen-luacheck-hl-std.sh"

[tasks.status]
description = "Stow health: which packages are fully / partially / not stowed"
# `stow -n` answers 'what would change for THIS package'. Nothing answered 'what
# is already half-done' — and a partially stowed package is silent: the missing
# drop-in simply never loads. fish sat with three unlinked conf.d files, one of
# them the local.env reader, and nothing reported it.
run = "./mise-scripts/stow-status.sh"

[tasks.stow]
description = "Pick packages with fzf (preview shows per-file state) and stow them"
run = "./mise-scripts/stow-pick.sh"

[tasks.metapac]
description = "Run metapac with the hardware-derived --hostname key (arch[-<gpu-vendor>]|macos)"
# metapac 0.10.0 selects per-host config by HOSTNAME and has no OS or hardware
# detection, so this repo's config.toml keys its tables by generic OS name plus
# detected GPU vendor (arch, arch-amd, arch-intel-nvidia, macos, ...) rather
# than real machine hostnames — which would otherwise leak into a public repo.
# commands/.local/bin/metapac-hostname-key computes that key from `uname` +
# `lspci`; this task and every shell's metapac wrapper call it so the key can't
# drift between them. This task is the documented canonical entry point for CI
# and scripts. Pass args through: `mise run metapac -- sync`.
# raw: mise's normal line-buffered output multiplexing eats stdin, so metapac's
# own y/N confirmation and paru's internal sudo password prompt never reach the
# terminal. raw connects stdio directly, restoring both prompts.
raw = true
run = """
FORCE_COLOR=0 metapac --hostname "$(metapac-hostname-key)" "$@"
"""

[tasks."setup:local-env"]
description = "Create ~/.config/dotfiles/local.env from placeholders (fill in, never commit)"
# Runs from a plain checkout — unlike `dotfiles-local-env --template`, which reads
# the example out of ~/.local/share/dotfiles and so needs `commands` stowed first.
# Variables come from the required-env manifest, so the file cannot lag behind it.
# Refuses to clobber an existing local.env; pass -- --force to overwrite.
run = "./mise-scripts/gen-local-env.sh"

[tasks."setup:frozen"]
description = "Apply the skip-worktree bits in .stow-frozen (per clone — the bit is not committed)"
# For files a program rewrites through the stow symlink (wallust output, qt6ct,
# gh-dash). Without this a fresh clone dirties its tree on every wallpaper
# rotation. Pass -- --check to audit instead of apply; exits 1 if any are unset.
run = "./mise-scripts/freeze-generated.sh"

[tasks."setup:git-spice"]
description = "Per-machine git-spice bootstrap: template, forge URL, auth, hooks (idempotent)"
# Supersedes setup:git-template for a fresh machine — it runs that step itself and
# then checks the parts that need sudo or interactive input, printing the exact
# command for each. Pass repos to retrofit: mise run setup:git-spice -- --repos ~/a ~/b
run = "./mise-scripts/setup-git-spice.sh"

[tasks."glab:config"]
description = "Apply glab prefs after `glab auth login` (token stays local, untracked)"
# The self-hosted host is machine-local (DOTFILES_GITLAB_HOST, set in
# ~/.config/fish/conf.d/local.fish). Without it, only the global prefs apply.
run = """
glab config set editor nvim
glab config set glamour_style dark
glab config set git_protocol ssh
if [ -n "${DOTFILES_GITLAB_HOST:-}" ]; then
  glab config set -h "$DOTFILES_GITLAB_HOST" git_protocol https
else
  echo "DOTFILES_GITLAB_HOST unset — skipping per-host git_protocol"
fi
"""

# ---------------------------------------------------------------------------
# Visual history — headless capture of the quickshell surfaces, archived into
# the notes vault ($DOTFILES_SCREENSHOT_ARCHIVE). See mise-scripts/visuals/README.md.
# ---------------------------------------------------------------------------

[tasks.screenshots]
description = "Capture the quickshell surfaces in a headless nested compositor"
run = "mise-scripts/visual-capture.sh"

[tasks."screenshots:archive"]
description = "Archive the latest captures into the vault history + regenerate the pages"
run = "mise-scripts/visual-archive.sh"

[tasks."screenshots:history"]
description = "Regenerate the history pages from the ledger (no new captures)"
run = "mise-scripts/render-visual-history.py"

[tasks.lint]
description = "Run every CI gate"
depends = [
  "lint:shell",
  "lint:secrets",
  "lint:private",
  "lint:yaml",
  "lint:json",
  "lint:nu",
  "lint:fish",
  "lint:lua",
]

[tasks."lint:shell"]
description = "shellcheck sh/bash scripts — error severity only (vendored scripts carry style noise)"
# File selection lives in mise-scripts/shell-files.sh, shared verbatim with the
# lint:shellcheck CI job so the two cannot drift. Exclusions and the shebang rule
# are documented there.
run = "./mise-scripts/shell-files.sh | xargs -r shellcheck --severity=error -e SC1090,SC1091,SC2148"

[tasks."lint:private"]
description = "block machine-local hostnames/IPs/serials from entering the repo"
# Two halves: values read from the untracked ~/.config/dotfiles/local.env (so no
# private string is ever committed as a denylist), plus generic patterns that are
# private by shape. CI has no local.env, which is why the pattern half exists.
run = "./mise-scripts/no-local-values.sh --all"

[tasks."lint:secrets"]
description = "gitleaks — scan TRACKED content for secrets (not untracked local configs)"
# Scans `git archive HEAD`, i.e. tracked files only, NOT `gitleaks dir .`. Two
# reasons, both learned the hard way:
#   - `gitleaks dir .` walks the working tree and does not honour .gitignore, so it
#     trips on the untracked provisioned configs (real glab token, MCP app
#     password). Scanning tracked content skips them with no allowlist needed.
#   - because no path allowlist is needed, .gitleaks.toml has none — so a
#     `gitleaks git` history scan is no longer blinded (see the comment there).
# Staged commits are still gated by the lefthook `gitleaks protect --staged` hook.
run = """
tmp=$(mktemp -d) || exit 1
trap 'rm -rf "$tmp"' EXIT
git archive HEAD | tar -x -C "$tmp"
gitleaks dir "$tmp" -c .gitleaks.toml --no-banner
"""

[tasks."lint:vuln"]
description = "grype — scan TRACKED content for known vulnerabilities (fail at high)"
# Deliberately NOT in `lint`'s depends list. It needs the network (grype
# auto-updates its ~200MB vulnerability DB, rate-limited to every 2h) and runs
# ~30s, so folding it into the fast gate would make every `mise run lint` both
# slower and offline-fragile. Run it on demand, or on a schedule.
#
# Scans `git archive HEAD` rather than the working tree, for the same reason as
# lint:secrets: `grype dir .` walks untracked local state — here that means
# .opencode/node_modules, a few thousand packages that can never be committed
# and whose CVEs are not this repo's to fix.
#
# Honest note on current yield: tracked content catalogs exactly THREE
# components, all pinned GitHub Actions from .github/workflows/lint.yml, with
# zero matches. This repo has no dependency manifests. The gate earns its keep
# on the day one lands (or a pinned action turns out to be vulnerable), not
# today — that is why it is a task rather than a CI job.
#
# Severity threshold comes from grype/.config/grype/config.yaml (fail-on-severity:
# high) once that package is stowed; -f high is passed explicitly so an unstowed
# checkout and CI get the same behaviour instead of grype's default of never
# failing.
run = """
tmp=$(mktemp -d) || exit 1
trap 'rm -rf "$tmp"' EXIT
git archive HEAD | tar -x -C "$tmp"
grype dir:"$tmp" -f high --name dotfiles
"""

[tasks."audit:secrets-history"]
description = "gitleaks over FULL history — the honest pre-rewrite audit (no path allowlists)"
# The counterpart to lint:secrets. lint gates the tracked HEAD; this surfaces every
# secret ever committed, so it fails until `git filter-repo` has stripped them.
# Expected to be RED until the history rewrite runs — that is the point.
run = "gitleaks git . -c .gitleaks.toml --no-banner"

[tasks."lint:yaml"]
description = "yamllint all yaml"
# File selection lives in mise-scripts/yaml-files.sh, shared verbatim with the GitLab
# lint:yaml job and the GitHub workflow. It excludes the two gitignored,
# machine-provisioned configs so a provisioned box selects the same set as a
# fresh CI clone.
run = "./mise-scripts/yaml-files.sh | xargs -r yamllint"

[tasks."lint:json"]
description = "validate all json parses"
run = "git ls-files '*.json' | xargs -r -I{} jq empty {}"

[tasks."lint:nu"]
description = "nushell parse check — fail on parser diagnostics (syntax only)"
# `nu --ide-check` always exits 0, so gate on diagnostic entries. It also
# resolves `source`/`use` targets and emits "File not found" for machine-local
# paths absent in a bare checkout — those are env noise, not syntax errors, so
# drop any "*not found*" diagnostic. Capture output fully to avoid SIGPIPE.
run = """
rc=0
for f in $(git ls-files '*.nu'); do
  out=$(nu --ide-check 1 "$f")
  # `|| true`: grep exits 1 when it filters everything out, which would abort
  # the task under mise's set -e even though that means "no errors".
  errs=$(printf '%s\\n' "$out" | grep '"type":"diagnostic"' | grep -iv 'not found' || true)
  if [ -n "$errs" ]; then
    echo "nu parse error in: $f"
    printf '%s\\n' "$errs"
    rc=1
  fi
done
exit $rc
"""

[tasks."lint:lua"]
description = "luacheck every tracked lua file"
# Scope is all tracked lua, not just quickshell/. Each package is written against a
# host that injects globals — hyprland `hl`, neovim `vim`, yazi `ya`/`cx`/`ui` — which
# is what kept this gate narrow: undeclared, they produced ~810 undefined-global
# warnings. .luacheckrc declares them per path instead of silencing them, so a typo
# like `hl.dsp.window.clos` is still caught. See .luacheckrc.
#
# GitLab CI still does not carry this gate — its runner cannot reach GitHub for mise's
# aqua installs and no luacheck-bundled image is in use, the same divergence as the
# rest. GitHub Actions already apt-installs lua-check and runs the full suite, so the
# widened scope reaches the strict gate with no workflow change.
run = """
if command -v luacheck >/dev/null 2>&1; then
  git ls-files '*.lua' | xargs -r luacheck --no-color
else
  echo "luacheck not installed — skipping lua lint"
fi
"""

[tasks."lint:fish"]
description = "fish syntax check (skipped where fish is absent, e.g. CI)"
run = """
if command -v fish >/dev/null 2>&1; then
  git ls-files '*.fish' | xargs -r -n1 fish --no-execute
else
  echo "fish not installed — skipping fish syntax check"
fi
"""

# ---------------------------------------------------------------------------
# Formatters — mutating. Run by the pre-commit hook (staged files) and on
# demand. CI does NOT gate on these yet; the repo has an un-formatted backlog.
# ---------------------------------------------------------------------------

[tasks.fmt]
description = "Apply all formatters to the whole repo"
depends = ["fmt:shell", "fmt:lua", "fmt:toml", "fmt:md"]

[tasks."fmt:shell"]
# Same selector as lint:shell and the CI job. It used to glob '*.sh' '*.bash',
# which diverged in both directions: it MISSED every extensionless command in
# commands/.local/bin and git/.local/bin — which is where the formatting backlog
# accumulated, since the formatter had never once run on them — and it HIT the two
# files the selector excludes on purpose, __sdkman-noexport-init.sh (zsh syntax)
# and RofiEmoji.sh (emoji data parsed as code), so `mise run fmt` exited non-zero
# on every single run.
run = "./mise-scripts/shell-files.sh | xargs -r shfmt -w -i 2 -ci -sr"

[tasks."fmt:lua"]
run = "stylua $(git ls-files '*.lua')"

[tasks."fmt:toml"]
run = "taplo fmt $(git ls-files '*.toml')"

[tasks."fmt:md"]
# markdownlint-cli2 comes from bun's global prefix (~/.bun/bin), not mise —
# see [tools] above. `mise install` alone won't provide it; `metapac sync` will.
run = "markdownlint-cli2 --fix $(git ls-files '*.md')"
