# Age out agent scratch under /tmp/claude-<uid> (Claude Code scratchpads,
# background-task output, throwaway review worktrees).
#
# /tmp is a RAM-backed tmpfs on the Arch desktop, so anything left here holds
# memory until reboot. Review worktrees with their own cargo target/ dirs once
# grew it to 58G of 63G over four days of uptime.
#
# `e` cleans an existing directory's contents by age and never creates it.
# Entries untouched for 2 days are removed; an active session keeps touching its
# own files, so only stale ones go. Run by systemd-tmpfiles-clean.timer (user):
#   systemctl --user enable --now systemd-tmpfiles-clean.timer
e /tmp/claude-%U - - - 2d
