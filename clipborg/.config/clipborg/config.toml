# clipborg config — see your GitLab instance for full docs.
# All keys are optional; commented values below are the built-in defaults.
#
# This is the BASE layer, stowed from ~/dotfiles/clipborg. clipborg reads
# ~/.config/clipborg/config.local.toml on top of it — that file is a real file, never
# stowed and never committed, and it is where API keys and per-machine paths belong.
# Nothing secret goes in this file.
#
# The local layer merges rather than replaces: tables merge key by key, and [[actions]] /
# [[llm.prompts]] / [[llm.harnesses]] merge BY `id`, so a local file can change one
# prompt's harness without restating the array below. Every other array replaces.
# Strings may use ${VAR} (env-expanded at load; `$${` is a literal `${`), and an unset
# variable is a hard error at startup rather than an empty string.

[storage]
# db_path = "~/.local/share/clipborg/db.sqlite3"
# image_dir = "~/.local/share/clipborg/images"
max_text_bytes = 1048576

[retention]
max_text_entries = 5000
max_image_entries = 10
max_file_entries = 10

[capture]
dedup_window_secs = 5
# Which kinds the daemon ingests. A disabled kind's bytes are never even read.
text = true
images = true
files = true

# What clipborg can do. Capabilities, not presentation — so these are global, and the
# quickshell dialog honours them too (it fetches them over IPC; it never reads this file).
# Everything on, spelled out rather than left to the defaults.
#
# Disabling is subtractive, never an error: config for a switched-off feature is ignored,
# not rejected. That is what lets this committed base name things a given machine lacks
# while config.local.toml switches them off.
[features]
registers = true # vim/nvim register ingest (TUI `R` popup, dialog tab)
pinning = true
actions = true   # the action menu ([[actions]])
filters = true   # the blocklists below

[features.llm]
enabled = true          # master switch for every LLM affordance
harnesses = true        # subprocess backends ([[llm.harnesses]])
api = true              # HTTPS providers ([[llm.providers]])
tmux = true             # the tmux mode this config defaults to
foreground = true       # hand the terminal to the harness
edit_before_send = true # honour a prompt's edit_before_send
backend_picker = true   # `h` in the prompt picker: override the backend per run

[filters]
# Block saving to history entirely. app_id/class match is case-insensitive
# exact match; content/title are regex, checked against the copied text /
# window title respectively. Clipboard offers tagged
# x-kde-passwordManagerHint (KeePassXC and similar) are always skipped
# regardless of these filters.
apps = []

# Forge access tokens must never reach the history database. Copying a PAT out of
# a GitLab or GitHub page is a routine act, and clipborg's store is sqlite on real
# disk with retention measured in weeks — so without this a token outlives the
# five seconds it was meant to exist for, gets backed up, and is one `clipborg
# list` away from a terminal. Blocked here means the copy still works normally;
# only the *recording* of it is skipped.
#
# CAREFUL: config.local.toml's `content_regex` REPLACES this array, it does not
# extend it — tables merge key by key, but every array outside [[actions]] and
# [[llm.*]] replaces. A machine whose local file sets content_regex for any other
# reason silently loses these patterns. Verified the hard way 2026-08-03: with the
# rules only here, a copied glpat-/ghp_ string was still recorded, because the
# local file had an unrelated blocklist. Restate them there, or drop the local key.
#
# Matched against the copied text as a regex. Prefixes rather than exact lengths:
# GitLab has widened glpat- twice, and a rule that misses a longer token is worse
# than one that occasionally blocks a string merely shaped like a token. There is
# no cost to a false positive here — one clipboard entry is not recorded.
#
#   gl(pat|ptt|rt|dt|soat|imt|agent|ffct|oas)- : GitLab personal / pipeline-trigger /
#                                                runner / deploy / SCIM / incoming-mail /
#                                                agent / feed / OAuth tokens
#   gh[pousr]_                                 : GitHub classic PAT, OAuth, user-to-server,
#                                                server-to-server, refresh
#   github_pat_                                : GitHub fine-grained PAT
content_regex = [
  "gl(pat|ptt|rt|dt|soat|imt|agent|ffct|oas)-[0-9A-Za-z_-]{16,}",
  "gh[pousr]_[0-9A-Za-z]{16,}",
  "github_pat_[0-9A-Za-z_]{16,}",
]

title_regex = []

# Terminal-only: what the TUI *draws*. The quickshell dialog ignores everything under [tui]
# — it has its own presentation in its own QML. Only the global sections above are shared.
#
# The tab bar: all eight builtin tabs (all, text, code, urls, images, files, colors, emails)
# are on, which is the default, so there is nothing to switch on here. Override a tab by id
# to rename or drop it — every field but `id` is optional:
#
#   [[tui.tabs]]
#   id = "colors"
#   enabled = false          # drop it
#
#   [[tui.tabs]]
#   id = "urls"
#   label = "links"          # keeps its categories and by_host
#
# (There is no registers tab in the terminal — `R` opens the live nvim register popup, which
# renders nothing like a clipboard list. The dialog does show them as a tab. Both are gated
# on [features] registers above: the capability is shared, the presentation isn't.)

[llm]
# Pipe an entry through an LLM harness; output becomes a new entry + clipboard.
# Prompt files live in ~/.config/clipborg/prompts/.
#
# There are NO built-in harnesses — this list is the whole list, and deleting a
# block removes that harness for good. `clipborg init` regenerates these from
# what is actually on $PATH.
default_harness = "claude"
copy_result = false
insert_result = false
# mode = "tmux" defaults every prompt to an interactive detached tmux session
# (no output capture); mode = "capture" grabs stdout and routes it per
# copy_result/insert_result. A per-prompt `mode` pins that prompt — `t` in
# the TUI picker can't push a capture-pinned prompt into tmux.
mode = "tmux"
timeout_secs = 120


# Local content only (code / file paths / files). URLs go to summarize-url below,
# which needs a fetch-capable harness — keeping them split avoids a capture run
# that silently refuses because it can't reach the network.
[[llm.prompts]]
id = "summarize"
label = "Summarize"
file = "prompts/summarize.md"
categories = ["code", "file-path", "files"]

insert_result = true
copy_result = true
mode = "capture"

[[llm.prompts]]
id = "summarize-url"
label = "Summarize this URL"
file = "prompts/summarize-url.md"
categories = ["url"]
harness = "claude-web"
insert_result = true
copy_result = true
mode = "capture"

[[llm.prompts]]
id = "explain-code"
label = "Explain this code"
file = "prompts/explain-code.md"
categories = ["code", "file-path", "files"]
# capture + insert so the answer is actually kept and can be shown back in the GUI.
# Without insert_result the harness output is captured and then discarded (the `llm`
# IPC op only returns entry_id/tmux_session, never the text), so there'd be nothing
# to display. copy_result stays false: explaining shouldn't clobber the clipboard.
insert_result = true
mode = "capture"

[[llm.prompts]]
id = "research-url"
label = "Research this URL"
file = "prompts/research-url.md"
categories = ["url"]


[[llm.prompts]]
id = "implement-plan"
label = "Implement this plan"
file = "prompts/implement-plan.md"
categories = ["file-path", "text", "code", "files"]

[[llm.prompts]]
id = "execute-task"
label = "Execute this task"
file = "prompts/execute-task.md"
categories = ["file-path", "text", "code", "files"]

[[llm.prompts]]
id = "vault-ingest"
label = "Ingest to vault"
file = "prompts/vault-ingest.md"
categories = ["file-path", "text", "code", "url", "files"]
