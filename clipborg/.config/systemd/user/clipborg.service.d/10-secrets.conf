# Give the clipborg daemon the LLM api keys and the gateway URL.
#
# A drop-in rather than an edit to clipborg.service: that unit ships with the
# clipborg source (packaging/linux/clipborg.service) and gets recopied on upgrade,
# which would silently drop anything added to it. Drop-ins survive that, and this
# is machine wiring, not part of the program.
#
# WHY THE DAEMON NEEDS THEM AT ALL, given it never calls an LLM: clipborg expands
# ${ENV} while LOADING config.toml and treats an unset or empty variable as a hard
# error — for every subcommand, not just the ones that would use the value. So one
# [[llm.providers]] block with api_key = "${PI_API_KEY}" makes that key mandatory
# for `clipborg daemon` as much as for `clipborg tui`. Without this file the daemon
# fails at startup with:
#
#   Error: llm provider litellm has an empty api_key
#
# `-` prefix on both: an absent file must not make the unit unstartable.
#
#   %t/dotfiles/secrets.env  written at login by dotfiles-secrets.service (tmpfs)
#   local.env                non-secret machine values; LITELLM_GATEWAY lives here
#
# Note what the `-` does NOT buy, since the wording here used to claim it: it
# tolerates a missing FILE, it does not make the daemon survive a missing KEY.
# Per the paragraph above, clipborg exits 1 on an unset ${PI_API_KEY} whatever the
# subcommand — so on this machine the cache is a hard dependency, not a bonus.
#
# local.env is also read by ~/.config/environment.d/50-local.conf, but that applies
# only to units started AFTER the user manager reads it at login. Naming it here
# too means a `systemctl --user restart clipborg.service` works in a session that
# predates the symlink, instead of failing on an unset ${LITELLM_GATEWAY}.

[Unit]
# ORDERING + A RESTART BUDGET THAT OUTLASTS THE FETCH. Both halves are needed, and
# neither alone is sufficient — observed 2026-08-11, when the daemon was dead all
# session and clipboard history was silently empty:
#
#   17:16:57  dotfiles-secrets starts, no cache yet
#   17:16:57  clipborg starts anyway, `Error: llm.providers[0].api_key references
#             unset PI_API_KEY`, and burns all 5 restarts inside 10s
#   17:17:07  dotfiles-secrets times out (10s, network still settling at login)
#   17:17:29  clipborg: "Start request repeated too quickly" -> failed, gives up
#   17:17:31  dotfiles-secrets' own retry succeeds and writes the cache — 2 SECONDS
#             after clipborg stopped trying
#
# After= alone would not have saved it: the ordering is released when the first job
# FINISHES, success or not, so clipborg would still have started at 17:17:07 against
# an empty cache. What the ordering does buy is the common case (cache present before
# first start); the restart budget covers the uncommon one.
#
# Sized against dotfiles-secrets' own bounded retry — 5 attempts, RestartSec=20s,
# each bounded by a 10s timeout, so ~150s worst case. 20 x 15s = 300s of coverage,
# with margin. Overrides StartLimitIntervalSec=60 / StartLimitBurst=5 in the unit
# shipped by clipborg, which is sized for "no compositor", not "no secrets yet".
Wants=dotfiles-secrets.service
After=dotfiles-secrets.service
StartLimitIntervalSec=600
StartLimitBurst=20

[Service]
RestartSec=15s
EnvironmentFile=-%t/dotfiles/secrets.env
EnvironmentFile=-%h/.config/dotfiles/local.env
