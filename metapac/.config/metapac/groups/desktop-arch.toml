# Moved out of core.toml (2026-07-27) so they stay Arch-only. mise is per-host:
# the two hosts share no mise tools. No node here — the system `nodejs` (declared
# in the arch block above) covers joplin/mermaid-cli/node-gyp; mise needs none.
mise = { packages = [
  { name = "android-sdk", options = { version = "latest" } },
  { name = "bun", options = { version = "1.3.3" } },
  { name = "zig", options = { version = "latest" } },
] }
cargo = { packages = [
  { name = "all-smi", options = { version = "0.20.1", git = "https://github.com/lablup/all-smi.git", features = [
  ] } },
