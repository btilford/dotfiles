# amd-gpu — packages only relevant on an AMD GPU/NPU host, split out of
# desktop-arch.toml so an Intel/Nvidia Arch box doesn't get AMD-only drivers
# and tooling (amdgpu_top, ROCm, Lemonade's AMD NPU inference server, etc.).
#
# Only included for hosts whose --hostname key is "arch-amd", resolved by
# commands/.local/bin/metapac-hostname-key via lspci GPU-vendor detection —
# see config.toml's hostname_groups comment for why the key can't be the real
# hostname. ollama-vulkan stays in desktop-arch.toml: Vulkan compute isn't
# AMD-specific.

arch = { packages = [
  "amd-ucode",
  "amdgpu_top",
  "amdxdna-driver-bin",
  "lemonade-server-git",
  "lib32-vulkan-radeon",
  "ollama-rocm",
  "rocm-opencl-sdk",
  "vulkan-radeon",
  "xf86-video-amdgpu",
] }
