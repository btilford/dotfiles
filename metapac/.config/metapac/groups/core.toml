# core — cross-platform tooling. Everything here must be installable on both
# Arch and macOS. Platform-only packages belong in desktop-arch.toml / macos.toml.
#
# Bootstrapped from `metapac unmanaged` on the Arch host, 2026-07-26.
# The mise block below is the ONLY shared one: everything else mise-owned is
# per-host, in desktop-arch.toml / macos.toml.

# java is the one mise tool both hosts need — nvim's jdtls config (nvim-java.lua)
# is cross-platform, and mise replaced sdkman as the JDK owner (2026-08-14).
# temurin-25: 25 is the current LTS (26 is not). NOT "latest", which would track
# every 6-month non-LTS release; NOT a full version, which pins the patch level.
# Only one JDK is declared because metapac keys a package by name and so cannot
# express mise's multi-version form. nvim-java.lua globs the mise installs dir
# rather than hardcoding a path, so an older JDK added by hand —
# `mise use -g java@temurin-21` — is picked up as a jdtls runtime automatically,
# and its absence just drops that runtime entry.
mise = { packages = [{ name = "java", options = { version = "temurin-25" } }] }

cargo = { packages = [
  { name = "just", options = { version = "1.46.0", features = [] } },
  # Owns the `workmux` stow package (config + shell completions). Cargo rather
  # than arch/bun: it is published only to crates.io, with no AUR or npm entry.
  "workmux",
  "tuicr",
] }

# Global JS CLIs go through bun, not npm — one owner, same as uv owns Python.
# bun itself is provided per-host by the OS package manager (extra/bun on Arch,
# homebrew-core on macOS), NOT by mise: metapac runs backends in enum order and
# reaches Bun before Mise, so a mise-owned bun is installed too late to be the
# interpreter for this very list.
bun = { packages = [
  "hunkdiff",
  # Used by `mise run fmt:md` and the hk pre-commit hook.
  "markdownlint-cli2",
  # nvim node host + treesitter, and the dev CLIs nvim drives (conform/lint/LSP).
  # Migrated off npm -g; both platforms.
  "neovim",
  "tree-sitter-cli",
  "typescript",
  "typescript-language-server",
  "prettier",
  "eslint",
  "@mistweaverco/kulala-fmt",
  "@mistweaverco/kulala-ls",
] }
