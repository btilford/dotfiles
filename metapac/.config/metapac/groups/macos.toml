# macos — macOS-only packages (host key: macos, via --hostname).
# Bootstrapped from `metapac unmanaged`, 2026-07-27 (brew formulae + casks
# merged; metapac installs/removes either by name). mise is per-host; bun comes
# from brew, not mise, so the shared bun backend (hunkdiff, markdownlint-cli2 in
# core) has an interpreter by the time it runs — see the note on the entry.
# metapac itself lives in cargo (brew has no formula).

brew = { packages = [
  "1password-cli",
  "act",
  "actionlint",
  "aerc",
  "ast-grep",
  "atuin",
  "bat",
  # homebrew-core `bun`. NOT the mise backend: metapac runs backends in enum
  # order (Brew, Bun, Cargo, … Mise), so a bun declared under mise is installed
  # long after the bun backend has already tried to run `bun install --global`
  # and died with ENOENT. Brew sorts first and lands in /opt/homebrew/bin, which
  # is on PATH without mise shims, so this self-bootstraps.
  "bun",
  "carapace",
  "claude-code",
  "cocoapods",
  "codeburn",
  "composer",
  "coreutils",
  "devtoys",
  "diffutils",
  "direnv",
  "docker-credential-helper",
  "dotnet@9",
  "ed",
  "entr",
  "eza",
  "fd",
  "ffmpeg",
  "findutils",
  "firefox",
  "fish",
  "fzf",
  "gawk",
  "gh",
  "ghostty",
  "ghq",
  "git-credential-manager",
  "git-delta",
  "git-interactive-rebase-tool",
  "git-lfs",
  "git-open",
  "git-sizer",
  "git-spice",
  "git-town",
  "gitleaks",
  "glab",
  "glow",
  "gnu-getopt",
  "gnu-sed",
  "gnu-tar",
  "gnu-which",
  "gnupg",
  "go",
  "grep",
  "grpcurl",
  "grype",
  "gzip",
  "ijhttp",
  "imagemagick",
  "joplin",
  "joplin-cli",
  "jq",
  "karabiner-elements",
  "kotlin-lsp",
  "lazydocker",
  "lazygit",
  "logcli",
  "lua",
  "lua-language-server",
  "luarocks",
  "make",
  "mongocli",
  "mongosh",
  "neovim-qt",
  "nmap",
  "notify",
  "nushell",
  "opencode",
  "orbstack",
  "p7zip",
  "pctl",
  "php",
  "pipx",
  "podman",
  "podman-desktop",
  "podman-tui",
  "postgresql@14",
  "putty",
  "rbenv",
  "redis",
  "restic",
  "rimz",
  "ripgrep-all",
  "ruby",
  "semgrep",
  "sesh",
  "shopify-cli",
  "silicon",
  "slk",
  "speedcrunch",
  "starship",
  "stow",
  "taproom",
  "telnet",
  "temporal",
  "tmux",
  "tree",
  "uv",
  "visidata",
  "w3m",
  "watch",
  "wget",
  "worktrunk",
  "yazi",
  "yq",
  "zoxide",
] }
cargo = { packages = [
  { name = "metapac", options = { version = "0.10.0", features = [
  ] } },
] }
mise = { packages = [
  { name = "ktlint", options = { version = "1.1.1" } },
  { name = "node", options = { version = "lts" } },
  { name = "terraform", options = { version = "latest" } },
  { name = "tmux", options = { version = "3.6a" } },
  { name = "yarn", options = { version = "4.12.0" } },
  # gcloud via mise's short registry name — NOT vfox:… (metapac rejects prefixed
  # names) and NOT brew (removed gcloud-cli/google-cloud-sdk; mise is sole owner).
  { name = "gcloud", options = { version = "latest" } },
] }
# Mac-only bun global. The nvim/dev toolchain lives in core.toml (both platforms).
bun = { packages = ["@shortcut-cli/shortcut-cli"] }
