# metapac — declarative system packages across machines.
# One stow package for every host; per-OS divergence lives in the tables below.
#
# The table keys are GENERIC OS names (`arch`, `macos`), optionally suffixed
# with detected GPU vendor(s) (`arch-amd`, `arch-intel-nvidia`, ...) — NOT real
# hostnames. metapac 0.10.0 keys per-host config by hostname and has no OS or
# hardware detection, so the real machine name would otherwise leak into this
# published repo. Each machine passes `--hostname <key>` to select its table;
# commands/.local/bin/metapac-hostname-key computes it from `uname` + `lspci`,
# and every shell wrapper plus `mise run metapac` calls that script so the key
# can't drift between them. Run metapac through those, or pass --hostname
# yourself. A bare `metapac` uses the real hostname, finds no matching key, and
# safely no-ops with a "no backends" warning.
#
# GPU-vendor package sets (amd-gpu.toml, nvidia-gpu.toml, intel-gpu.toml) are
# only pulled in for a hostname key that names that vendor — adding a new
# vendor combination to the fleet means adding its key here.
#
# macOS splits by PROFILE for the same reason Arch splits by GPU vendor: one base
# set, plus a per-machine overlay. metapac-hostname-key reads DOTFILES_PROFILE
# (the repo's existing personal/work seam) and appends it. Every macOS key keeps
# `macos` in its group list, so the base set is shared and only the overlay
# diverges. Plain `macos` is the fallback for an unset or unrecognised profile:
# it is the shared set alone, which is what the key resolved to before the split,
# so a machine with no local.env is unchanged.
#
# Backends (final set): apt, arch, brew, bun, cargo, flatpak, mise, uv.
# pipx is deliberately absent — uv owns global Python CLIs.
# zypper is absent — no openSUSE host in the fleet.

hostname_groups_enabled = true

# Base set stays empty; every host opts in explicitly below.
enabled_backends = []

[hostname_enabled_backends]
arch = ["arch", "bun", "cargo", "flatpak", "mise", "uv"]
arch-amd = ["arch", "bun", "cargo", "flatpak", "mise", "uv"]
arch-intel-nvidia = ["arch", "bun", "cargo", "flatpak", "mise", "uv"]
macos = ["brew", "cargo", "mise", "uv", "bun"]
macos-personal = ["brew", "cargo", "mise", "uv", "bun"]
macos-work = ["brew", "cargo", "mise", "uv", "bun"]
wsl-ubuntu = ["apt", "bun", "cargo", "mise"]

[hostname_groups]
arch = ["core", "desktop-arch"]
arch-amd = ["core", "desktop-arch", "amd-gpu"]
arch-intel-nvidia = ["core", "desktop-arch", "intel-gpu", "nvidia-gpu"]
macos = ["core", "macos"]
macos-personal = ["core", "macos", "macos-personal"]
macos-work = ["core", "macos", "macos-work"]
wsl-ubuntu = ["core", "wsl-ubuntu"]

[arch]
# Required: routes AUR installs through the aur-policy PreBuildCommand gate.
package_manager = "paru"
