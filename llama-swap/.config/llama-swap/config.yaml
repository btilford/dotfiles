# llama-swap — the serving layer that replaces Lemonade.
#
# WHY THIS EXISTS
#
# Lemonade serves exactly one LLM at a time (`max_models.llm = 1`), so the
# completion model and the assistant model evict each other on every alternating
# request. That single fact is what makes inline completion unusable and is the
# whole reason for this file. llama-swap keeps a group of models resident
# together and swaps only the ones it must.
#
# WHY EVERY COMMAND IS A `podman run`
#
# Building llama.cpp for gfx1151 (Strix Halo) is fiddly enough that the
# kyuz0/amd-strix-halo-toolboxes images exist specifically to get it right, and
# they are rebuilt against llama.cpp master.
#
# USE A LIVE TAG. `rocm-7.2.1` looked reasonable and is ABANDONED — re-pulling it
# yielded llama.cpp b8940 while upstream was at b10235, and Qwen3.6-35B-MTP
# failed to load with `missing tensor 'blk.40.ssm_conv1d.weight'` purely because
# of that age. The maintained tags (rocm-7.14, rocm-6.4.4, therock-nightly,
# vulkan-radv, vulkan-amdvlk) rebuild several times a day; check
# hub.docker.com/v2/repositories/kyuz0/amd-strix-halo-toolboxes/tags before
# assuming a pull is current.
#
# A container cannot change the kernel — it shares the host's. Kernel-level
# concerns (amdgpu, ROCm's kernel driver, GTT sizing via amdgpu.gttsize, amdxdna)
# are host-only and already in place here; everything the toolbox provides is
# userspace. Running the tested container beats
# maintaining a host build. Verified working: ROCm sees the iGPU as
# `Radeon 8060S Graphics, gfx1151`, 131072 MiB, and gemma3-4b benchmarks at
# pp64 1678 t/s / tg16 49 t/s from inside the container.
#
# The commands are written out per model rather than shared through a macro. It
# is repetitive on purpose — macro support varies between llama-swap releases,
# and a config that fails to parse takes every model down at once.
#
# MODEL PATHS ARE INSIDE THE CONTAINER
#
# /srv/models is bind-mounted read-only at /models. The store is deliberately
# NOT under /home: see the ProtectHome note below.

healthCheckTimeout: 300
logLevel: info

# Well clear of the other local services: LiteLLM 4000, docker-model-runner
# 12434, Lemonade 13305.
startPort: 9200

models:
  # ---------------------------------------------------------------------------
  # role/completion — inline completion in nvim and JetBrains.
  #
  # Qwen2.5-Coder is chosen for FILL-IN-THE-MIDDLE. Inline completion gives the
  # model a prefix AND a suffix and asks it to bridge the gap; an instruct/chat
  # model cannot do that properly no matter how capable it is — it narrates
  # instead of completing. This is also why the assistant model below is not a
  # candidate for this role.
  #
  # Latency budget is roughly 300 ms to first token. Keep the context modest:
  # prefill time scales with it, and completion sees only the surrounding lines.
  # ---------------------------------------------------------------------------
  "qwen2.5-coder-7b":
    # Explicit IPv4: llama-swap proxies to `localhost`, which resolves to ::1
    # first, while podman publishes IPv4 only — every request was reset.
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >
      podman run --rm -i --name llamaswap-qwen25-coder-7b
      --device /dev/kfd --device /dev/dri
      --group-add keep-groups
      --security-opt seccomp=unconfined
      -p 127.0.0.1:${PORT}:${PORT}
      -v /srv/models:/models:ro
      docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-7.14
      llama-server --host 0.0.0.0 --port ${PORT}
      -m /models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      -ngl 99 --flash-attn on -c 8192
    # Never unload: an inline completion model that has to cold-start has already
    # missed its latency budget.
    ttl: 0

  # ---------------------------------------------------------------------------
  # role/assistant — atuin's `?` prompt and quick shell questions.
  #
  # Provisional. Qwen3-4B-Instruct-2507 would be the better default on licence
  # (Apache 2.0, which matters because this config reaches a work machine) and on
  # CLI-heavy training, but its weights are in Lemonade's private store and not
  # yet re-pulled into /srv/models. gemma-3-4b is what is on disk today.
  # ---------------------------------------------------------------------------
  "gemma3-4b":
    # Explicit IPv4: llama-swap proxies to `localhost`, which resolves to ::1
    # first, while podman publishes IPv4 only — every request was reset.
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >
      podman run --rm -i --name llamaswap-gemma3-4b
      --device /dev/kfd --device /dev/dri
      --group-add keep-groups
      --security-opt seccomp=unconfined
      -p 127.0.0.1:${PORT}:${PORT}
      -v /srv/models:/models:ro
      docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-7.14
      llama-server --host 0.0.0.0 --port ${PORT}
      -m /models/gemma3-4b-it-qat/gemma-3-4b-it-q4_0.gguf
      -ngl 99 --flash-attn on -c 8192
    ttl: 0

  # ---------------------------------------------------------------------------
  # Quality on demand. Not in the warm group — 16 GiB is affordable to hold but
  # pointless to pin for something used occasionally.
  # ---------------------------------------------------------------------------
  "gemma3-27b":
    # Explicit IPv4: llama-swap proxies to `localhost`, which resolves to ::1
    # first, while podman publishes IPv4 only — every request was reset.
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >
      podman run --rm -i --name llamaswap-gemma3-27b
      --device /dev/kfd --device /dev/dri
      --group-add keep-groups
      --security-opt seccomp=unconfined
      -p 127.0.0.1:${PORT}:${PORT}
      -v /srv/models:/models:ro
      docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-7.14
      llama-server --host 0.0.0.0 --port ${PORT}
      -m /models/gemma3-27b-it-qat/gemma-3-27b-it-q4_0.gguf
      -ngl 99 --flash-attn on -c 16384
    ttl: 900

  # ---------------------------------------------------------------------------
  # role/assistant — replaces gemma3-4b, which CANNOT serve this role.
  #
  # Gemma's chat template enforces strict user/assistant alternation and rejects
  # consecutive user messages ("Conversation roles must alternate ..."). atuin-ai
  # sends context and query as two user messages, so Gemma fails no matter how it
  # is configured. Qwen's template is permissive.
  #
  # Also Apache 2.0 rather than Gemma's use policy, which matters because this
  # config reaches a work machine.
  # ---------------------------------------------------------------------------
  "qwen3-4b-instruct":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >
      podman run --rm -i --name llamaswap-qwen3-4b-instruct
      --device /dev/kfd --device /dev/dri
      --group-add keep-groups
      --security-opt seccomp=unconfined
      -p 127.0.0.1:${PORT}:${PORT}
      -v /srv/models:/models:ro
      docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-7.14
      llama-server --host 0.0.0.0 --port ${PORT}
      -m /models/hf/hub/models--unsloth--Qwen3-4B-Instruct-2507-GGUF/snapshots/a06e946bb6b655725eafa393f4a9745d460374c9/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      -ngl 99 --flash-attn on -c 8192
    ttl: 0

  # ---------------------------------------------------------------------------
  # role/reasoning — the best local model measured on this box, and the LAST
  # thing tying anything to Lemonade. Once this serves, Lemonade can be retired
  # and its ~530 GB private store deleted.
  #
  # Not in the warm group: 21 GiB is affordable to hold but pointless to pin for
  # a model used deliberately rather than continuously.
  #
  # -c 131072, not 16384, because this also backs role/agent — Hermes and other
  # agent harnesses run long conversations and 16k truncates them. 16k was sized
  # for the nvim/atuin roles, which this model does not serve.
  #
  # KV cost is exact and affordable. From the GGUF: 41 blocks, head_count_kv 2,
  # key/value_length 256, fp16 =
  #   41 * 2 * (256+256) * 2 B = 83,968 B/token ~= 82 KiB/token
  #   16384 ->  1.28 GiB      131072 -> 10.25 GiB
  # So ~23 GiB weights + ~10 GiB KV = ~33 GiB resident, against 125 GiB unified.
  # Measured baseline with this and the warm group up is ~29 GiB GTT, ~81 GiB
  # free. Model native context is 262144, so 131072 needs no rope scaling.
  #
  # If headroom ever gets tight, halve the KV with
  # `--cache-type-k q8_0 --cache-type-v q8_0` (valid because flash-attn is on)
  # before reducing -c. Do NOT raise this to 262144: that is 20.5 GiB of KV for
  # context no local agent actually fills.
  # ---------------------------------------------------------------------------
  "qwen3.6-35b-mtp":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >
      podman run --rm -i --name llamaswap-qwen3.6-35b-mtp
      --device /dev/kfd --device /dev/dri
      --group-add keep-groups
      --security-opt seccomp=unconfined
      -p 127.0.0.1:${PORT}:${PORT}
      -v /srv/models:/models:ro
      docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-7.14
      llama-server --host 0.0.0.0 --port ${PORT}
      -m /models/hf/hub/models--unsloth--Qwen3.6-35B-A3B-MTP-GGUF/snapshots/5bc3e238d916f48a861bac2f8a1990a0e9b7e98d/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      -ngl 99 --flash-attn on -c 131072
    ttl: 900

# EVERY MODEL MUST BE IN A GROUP.
#
# A model listed in no group lands in llama-swap's implicit default group, which
# is `exclusive: true`. Exclusivity is a property of the group being LOADED, not
# of the group being protected: `warm: exclusive: false` only stops warm from
# tearing other groups down, it does NOT stop them tearing warm down. So an
# ungrouped model evicted the warm group on every load — measured, with
# qwen3-4b-instruct disappearing the moment qwen3.6-35b-mtp came up and having to
# cold-start on the next completion request. That is the exact failure mode this
# file exists to prevent.
groups:
  # THE POINT OF THE WHOLE EXERCISE. `swap: false` lets these two run at the same
  # time instead of evicting each other, which is exactly what Lemonade cannot
  # do. Together they are ~7.3 GiB against 128 GiB of unified memory, so holding
  # both costs nothing worth measuring.
  #
  # `exclusive: false` so warm does not tear anything else down when it loads.
  # What keeps warm ALIVE is that every other model is in `ondemand` below, which
  # is also non-exclusive.
  warm:
    swap: false
    exclusive: false
    members:
      - "qwen2.5-coder-7b"
      - "qwen3-4b-instruct"

  # Deliberately requested, not continuously used. `exclusive: false` is the half
  # that matters — it is what leaves the warm group standing.
  #
  # `swap: true` because these are the big ones and they have no reason to be
  # resident together: 35B is ~23 GiB weights + ~10 GiB KV at -c 131072, 27B is
  # ~16 GiB. Holding both alongside warm would fit in 125 GiB unified, but each
  # is used in isolation and `ttl` already returns the memory.
  ondemand:
    swap: true
    exclusive: false
    members:
      - "qwen3.6-35b-mtp"
      - "gemma3-27b"
      - "gemma3-4b"
