# AeroSpace — the macOS counterpart of the Hyprland setup in `hyprland/`.
#
# The keymap mirrors `hyprland/.config/hypr/lua/keybindings.lua`. That config is
# modal: a leader key opens a submap, and the next key acts inside it. AeroSpace
# binding modes are the direct equivalent, so the leader letters and the inner
# letters are the same.
#
# MODIFIER. Hyprland uses SUPER, the key beside the space bar. This config writes
# `alt` for that key. On this Mac, System Settings swaps Option and Command, and
# that swap happens below the event tap AeroSpace reads. AeroSpace therefore sees
# `alt` when the Command key is pressed. Do not read `alt` here as "the Option
# key". Read `macos/README.md` for the full mapping table and for the list of
# Hyprland behavior that AeroSpace cannot reproduce.
#
# This file is untested. No Mac was available when it was written.

after-login-command = []
after-startup-command = []

start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

# Hyprland `general.layout` is "master" on multi-monitor and "scrolling" on a
# single monitor (see lua/layout-auto.lua). AeroSpace has neither. `tiles` is the
# closest root layout.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Matches the stock sample and keeps the pointer with the focused monitor.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Hyprland has no "hide application" concept, so cmd-h must not make a window
# disappear from the tiling tree.
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

# Gaps copied from `hyprland/.config/hypr/lua/windows.lua`:
#   gaps_in = 4, gaps_out = { top = 6, right = 2, bottom = 2, left = 2 }
# AeroSpace has no rounding, no border width, no blur, no shadow and no shaders,
# so nothing in lua/decorations.lua carries over.
[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 2
outer.bottom = 2
outer.top = 6
outer.right = 2

# Workspace-to-monitor pinning.
#
# Hyprland pins workspaces 1-10 across four displays through the machine-local
# MON alias table. The MacBook usually runs one display, where every assignment
# below is a no-op, so the block stays commented out. To use it, uncomment it.
# Only the patterns `main` and `secondary` are used here. Never write a monitor
# name or a panel serial into this file — this repository is public.
#
# [workspace-to-monitor-force-assignment]
# 1 = 'main'
# 2 = 'secondary'
# 3 = 'secondary'
# 4 = 'secondary'
# 5 = 'main'
# 6 = 'secondary'
# 7 = 'secondary'
# 8 = 'secondary'
# 9 = 'main'
# 10 = 'secondary'

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------
# `hyprland/.config/hypr/lua/windowrules.lua` is 236 lines. AeroSpace can express
# only "float this window" and "send it to a workspace". Size, position, opacity,
# blur, border and animation rules have no equivalent and are dropped.
#
# Most of the Hyprland float list is Linux software (pavucontrol, blueman,
# nm-connection-editor, wlogout, rofi, xwaylandvideobridge). Only the rules with a
# macOS counterpart are ported.
#
# Verify every bundle identifier on the machine with:  aerospace list-apps
# Workspaces 1 to 5 hold one application each, in the order the keyboard leader
# expects. Read "The keyboard leader depends on ctrl-1 to ctrl-5" in
# `macos/README.md` before you change a number here.
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'notion.id'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'net.mullvad.vpn'
run = ['layout floating']

# Hyprland pins JetBrains Toolbox to workspace 1. Here workspace 1 holds the
# browser and workspace 3 is the IDE workspace, so the Toolbox goes to 3. The
# bundle identifier of the IDE itself differs per product, so verify it with
# `aerospace list-apps` and add a rule for it beside this one.
[[on-window-detected]]
if.app-id = 'com.jetbrains.toolbox'
run = ['layout floating', 'move-node-to-workspace 3']

# ---------------------------------------------------------------------------
# Main mode
# ---------------------------------------------------------------------------
[mode.main.binding]

# Focus. Hyprland: SUPER + h/j/k/l.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move the focused window. Hyprland keeps this inside the window submap on
# CTRL + h/j/k/l, and that binding is kept there too.
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Close. Hyprland: SUPER + Q, and SUPER + SHIFT + Q force-kills the process.
# AeroSpace cannot kill a process. `--quit-if-last-window` quits the application
# when its last window closes, which is the nearest macOS behavior.
alt-q = 'close'
alt-shift-q = 'close --quit-if-last-window'

# Workspaces 1-10. Hyprland: SUPER + 1 .. SUPER + 0.
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# AeroSpace wins over native macOS Spaces. There is one native Space, and nothing
# here ever addresses it. The bindings below take the seven shortcuts that used to
# drive Spaces and point them at AeroSpace workspaces instead.
#
# The keyboard leader in `macos.dtsi` sends ctrl-1 to ctrl-5 to reach a desktop,
# and ctrl-left or ctrl-right to step between them. Nine of its sequences depend
# on the seven bindings below. Removing one breaks the keyboard.
#
# REQUIRED SETUP, or macOS swallows these before AeroSpace sees them. In System
# Settings > Keyboard > Keyboard Shortcuts > Mission Control, clear every
# "Switch to Desktop N" shortcut and both "Move left/right a space" shortcuts.
# Read `macos/README.md` for the rest of the once-per-machine steps.
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-right = 'workspace --wrap-around next'
ctrl-left = 'workspace --wrap-around prev'

# Workspaces 11-13. On Linux these are pinned to the XREAL glasses. The glasses
# are not used with the MacBook, so the workspaces stay unpinned. macOS needs the
# fn key for the function row unless the keyboard preference is changed.
alt-f1 = 'workspace 11'
alt-f2 = 'workspace 12'
alt-f3 = 'workspace 13'
alt-shift-f1 = 'move-node-to-workspace 11'
alt-shift-f2 = 'move-node-to-workspace 12'
alt-shift-f3 = 'move-node-to-workspace 13'

# Move the window to a workspace without following it.
# Hyprland: SUPER + ALT + x/c/v/s/d/f/w/e/r/b. macOS cannot send two alt keys, so
# the second modifier is ctrl.
alt-ctrl-x = 'move-node-to-workspace 1'
alt-ctrl-c = 'move-node-to-workspace 2'
alt-ctrl-v = 'move-node-to-workspace 3'
alt-ctrl-s = 'move-node-to-workspace 4'
alt-ctrl-d = 'move-node-to-workspace 5'
alt-ctrl-f = 'move-node-to-workspace 6'
alt-ctrl-w = 'move-node-to-workspace 7'
alt-ctrl-e = 'move-node-to-workspace 8'
alt-ctrl-r = 'move-node-to-workspace 9'
alt-ctrl-b = 'move-node-to-workspace 10'

# Hyprland: SUPER + ALT + h/l move the window to the previous or next workspace.
alt-ctrl-h = 'move-node-to-workspace --wrap-around prev'
alt-ctrl-l = 'move-node-to-workspace --wrap-around next'

# Workspace cycling. Hyprland: SUPER + Tab and SUPER + SHIFT + Tab.
alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'

# Layout cycle. Hyprland: SUPER + SHIFT + L cycles dwindle, master and scrolling.
# AeroSpace has only two layouts, so this toggles tiles and accordion. The key
# moves to alt-slash because alt-shift-l already moves a window to the right.
alt-slash = 'layout tiles accordion'

# Reload the config. Hyprland: SUPER + SHIFT + R.
alt-shift-r = 'reload-config'

# Hyprland also locks the session on CTRL + ALT + L. That combination is
# alt-ctrl-l here, which already moves a window to the next workspace, so the
# lock binding lives only in the `system` mode on `l`.

# File manager. Hyprland: SUPER + E opens yazi in a Ghostty window.
alt-e = 'exec-and-forget open -na Ghostty --args -e yazi'

# Mode leaders. Each one matches a Hyprland submap leader.
alt-o = 'mode open'
alt-s = 'mode system'
alt-w = 'mode window'
alt-d = 'mode workspace'
alt-f = 'mode focus'
alt-t = 'mode time'

# NO MACOS EQUIVALENT, so these Hyprland binds are not carried over:
#   SUPER + Escape        session and power menu (no scriptable macOS dialog)
#   SUPER + slash         keymap cheatsheet overlay (quickshell)
#   SUPER + r             application launcher (macOS uses cmd-space)
#   SUPER + CTRL + RETURN application launcher (same)
#   SUPER + y             clipboard history (clipborg, Linux only)
#   SUPER + i             notification drawer (quickshell)
#   SUPER + SHIFT + N     dismiss all notifications (quickshell)
#   SUPER + c             clock drawer (quickshell)
#   SUPER + n             notification submap (quickshell)
#   SUPER + m             timer submap (quickshell)
#   SUPER + g             toggle window group (AeroSpace has no groups)
#   SUPER + CTRL + down   focus the first empty workspace
#   SUPER + mouse drag    move and resize (AeroSpace has no mouse bindings)
#   SUPER + scroll        workspace cycling (AeroSpace has no scroll bindings)
#   XF86 media and brightness keys (macOS handles its own media row)

# ---------------------------------------------------------------------------
# open — Hyprland submap `open-cmd`, leader SUPER + o
# ---------------------------------------------------------------------------
[mode.open.binding]
b = ['exec-and-forget open -a "Brave Browser"', 'mode main']
t = ['exec-and-forget open -na Ghostty', 'mode main']
c = ['exec-and-forget open -a Calculator', 'mode main']
z = ['exec-and-forget open -a "Activity Monitor"', 'mode main']
esc = 'mode main'
# NO MACOS EQUIVALENT: e (emoji picker), u (glyph picker) and i (icon browser)
# all call `hyprland/.config/hypr/scripts/Launcher.sh`, which needs rofi or
# quickshell. macOS has its own emoji picker on ctrl-cmd-space.
# NO MACOS EQUIVALENT: v (clipboard history) needs clipborg or quickshell.

# ---------------------------------------------------------------------------
# system — Hyprland submap `system-cmd`, leader SUPER + s
# ---------------------------------------------------------------------------
[mode.system.binding]
# Hyprland cycles DPMS to clear hotplug artifacts. The nearest macOS action is a
# display sleep. macOS has no per-monitor form, so `d` and `shift-d` are the same.
d = ['exec-and-forget pmset displaysleepnow', 'mode main']
shift-d = ['exec-and-forget pmset displaysleepnow', 'mode main']
r = ['reload-config', 'mode main']
l = ['exec-and-forget pmset displaysleepnow', 'mode main']
esc = 'mode main'
# NO MACOS EQUIVALENT: b restarts the status bar (waybar or quickshell).
# NO MACOS EQUIVALENT: e opens the session and power menu (wlogout).

# ---------------------------------------------------------------------------
# window — Hyprland submap `window-cmd`, leader SUPER + w
# ---------------------------------------------------------------------------
[mode.window.binding]
tab = 'focus dfs-next'
n = 'split opposite'
r = 'layout horizontal vertical'
q = ['close', 'mode main']
f = ['fullscreen', 'mode main']
m = ['fullscreen --no-outer-gaps', 'mode main']
t = ['layout floating tiling', 'mode main']
s = 'mode swap'
# `m` is the Hyprland maximize binding. AeroSpace has no separate maximize, so it
# is a fullscreen that also fills the gaps. `macos-native-fullscreen` is
# deliberately NOT used: it creates a native macOS Space, and this config treats
# native Spaces as if they do not exist. The same goes for
# `macos-native-minimize`, which hides a window from the tiling tree.
esc = 'mode main'

# Focus.
h = 'focus left'
j = 'focus down'
k = 'focus up'
l = 'focus right'

# Move the window inside the tree.
ctrl-h = 'move left'
ctrl-j = 'move down'
ctrl-k = 'move up'
ctrl-l = 'move right'

# Resize. Hyprland uses 10 pixels for the small step and 100 for the large one.
# AeroSpace resize units are also pixels.
shift-h = 'resize width -10'
shift-j = 'resize height +10'
shift-k = 'resize height -10'
shift-l = 'resize width +10'
ctrl-shift-h = 'resize width -100'
ctrl-shift-j = 'resize height +100'
ctrl-shift-k = 'resize height -100'
ctrl-shift-l = 'resize width +100'

# Hyprland `comma` swaps with the master window and `period` rolls the stack.
# AeroSpace has no master area, so both become a swap along the tree order.
comma = 'swap dfs-prev'
period = 'swap dfs-next'

# NO AEROSPACE EQUIVALENT: c centers a floating window. AeroSpace places
# floating windows itself and offers no center command.
# NO AEROSPACE EQUIVALENT: ALT + h/j/k/l nudge a floating window by 10 pixels.
# NO AEROSPACE EQUIVALENT: SUPER + l sets the dwindle layout.

# ---------------------------------------------------------------------------
# swap — Hyprland submap `window-swap`, reached with `s` inside `window`
# ---------------------------------------------------------------------------
[mode.swap.binding]
h = 'swap left'
j = 'swap down'
k = 'swap up'
l = 'swap right'
esc = 'mode window'

# ---------------------------------------------------------------------------
# workspace — Hyprland submap `workspace-cmd`, leader SUPER + d
# ---------------------------------------------------------------------------
[mode.workspace.binding]
tab = 'workspace --wrap-around next'
shift-tab = 'workspace --wrap-around prev'
ctrl-tab = 'move-node-to-workspace --focus-follows-window --wrap-around next'
ctrl-shift-tab = 'move-node-to-workspace --focus-follows-window --wrap-around prev'

# Move the window to a workspace and follow it.
ctrl-x = ['move-node-to-workspace --focus-follows-window 1', 'mode main']
ctrl-c = ['move-node-to-workspace --focus-follows-window 2', 'mode main']
ctrl-v = ['move-node-to-workspace --focus-follows-window 3', 'mode main']
ctrl-s = ['move-node-to-workspace --focus-follows-window 4', 'mode main']
ctrl-d = ['move-node-to-workspace --focus-follows-window 5', 'mode main']
ctrl-f = ['move-node-to-workspace --focus-follows-window 6', 'mode main']
ctrl-w = ['move-node-to-workspace --focus-follows-window 7', 'mode main']
ctrl-e = ['move-node-to-workspace --focus-follows-window 8', 'mode main']
ctrl-r = ['move-node-to-workspace --focus-follows-window 9', 'mode main']
ctrl-b = ['move-node-to-workspace --focus-follows-window 10', 'mode main']

# Focus a workspace.
1 = ['workspace 1', 'mode main']
2 = ['workspace 2', 'mode main']
3 = ['workspace 3', 'mode main']
4 = ['workspace 4', 'mode main']
5 = ['workspace 5', 'mode main']
6 = ['workspace 6', 'mode main']
7 = ['workspace 7', 'mode main']
8 = ['workspace 8', 'mode main']
9 = ['workspace 9', 'mode main']
0 = ['workspace 10', 'mode main']

l = ['layout tiles accordion', 'mode main']
esc = 'mode main'
# NO MACOS EQUIVALENT: w, shift-w and t choose a wallpaper or a theme. Both call
# wallust and the Hyprland scripts directory.

# ---------------------------------------------------------------------------
# focus — Hyprland submap `focus-cmd`, leader SUPER + f
# ---------------------------------------------------------------------------
# Hyprland focuses a window by its Wayland class. AeroSpace has no
# focus-by-application command. Each application has its own workspace instead,
# so focusing one is a workspace switch. The letters match the keyboard leader:
# b browser, t terminal, i IDE, n Notion, o Obsidian.
[mode.focus.binding]
b = ['workspace 1', 'mode main']
t = ['workspace 2', 'mode main']
i = ['workspace 3', 'mode main']
n = ['workspace 4', 'mode main']
o = ['workspace 5', 'mode main']
l = ['focus-back-and-forth', 'mode main']
esc = 'mode main'

# ---------------------------------------------------------------------------
# time — Hyprland submap `time-cmd`, leader SUPER + t
# ---------------------------------------------------------------------------
# The Linux side calls `hyprland/.config/hypr/scripts/CopyDateTime.sh`, which
# writes to the Wayland clipboard with wl-copy. The formats below are the same
# table, written for BSD date and pbcopy. printf is used instead of echo so that
# no trailing newline is copied.
#
# One difference: `iso` uses `date -Iseconds` on Linux, which prints the offset as
# +00:00. BSD date has no -Iseconds, so %z prints the offset as +0000.
[mode.time.binding]
d = [
  '''exec-and-forget printf '%s' "$(date +%Y-%m-%d)" | pbcopy''',
  'mode main',
]
shift-d = [
  '''exec-and-forget printf '%s' "$(date -u +%Y-%m-%d)" | pbcopy''',
  'mode main',
]
t = [
  '''exec-and-forget printf '%s' "$(date +%H:%M:%S)" | pbcopy''',
  'mode main',
]
shift-t = [
  '''exec-and-forget printf '%s' "$(date -u +%H:%M:%S)" | pbcopy''',
  'mode main',
]
b = [
  '''exec-and-forget printf '%s' "$(date '+%Y-%m-%d %H:%M:%S')" | pbcopy''',
  'mode main',
]
shift-b = [
  '''exec-and-forget printf '%s' "$(date -u '+%Y-%m-%d %H:%M:%S')" | pbcopy''',
  'mode main',
]
i = [
  '''exec-and-forget printf '%s' "$(date +%Y-%m-%dT%H:%M:%S%z)" | pbcopy''',
  'mode main',
]
shift-i = [
  '''exec-and-forget printf '%s' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | pbcopy''',
  'mode main',
]
s = [
  '''exec-and-forget printf '%s' "$(date +%Y-%m-%dT%H:%M:%S)" | pbcopy''',
  'mode main',
]
e = ['''exec-and-forget printf '%s' "$(date +%s)" | pbcopy''', 'mode main']
n = [
  '''exec-and-forget printf '%s' "$(date +%b-%d-%a)" | pbcopy''',
  'mode main',
]
esc = 'mode main'

# ---------------------------------------------------------------------------
# Dropped submaps
# ---------------------------------------------------------------------------
# notif-cmd (SUPER + n) and timer-cmd (SUPER + m) are not carried over. Every
# binding in both calls `qs ipc call ...`, the quickshell IPC. quickshell is
# Wayland software and does not run on macOS. macOS has its own Notification
# Center, and no timer service that AeroSpace can drive.
