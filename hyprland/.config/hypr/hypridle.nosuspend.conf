# hypridle config for hosts that must never sleep (e.g. cachyos-fwd: Lemonade LLM server).
# Selected by hostname in lua/autostart.lua. See:
#   ~/Documents/personal-notes/notes/plans/lemonade-no-sleep.md

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms off; sleep 0.5; hyprctl dispatch dpms on; sleep 1; pgrep awww-daemon || (mkdir -p ~/.cache/awww && awww-daemon &)
}

# Screen lock after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# DPMS off after 11 minutes (1 min after lock)
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms off; sleep 0.5; hyprctl dispatch dpms on
}

# No suspend listener — system stays awake.
