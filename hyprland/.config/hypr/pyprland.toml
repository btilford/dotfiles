[pyprland]
plugins = [
  # "zoom",
  "scratchpads",
  "expose"
    "shift_monitors",
    "workspaces_follow_focus"
]
[scratchpads.term]
animation = "fromTop"
command = "[term_classed] main-dropterm"
class = "main-dropterm"
size = "75% 60%"
max_size = "1920px 100%"


[pyprland.variables]
term_classed = "kitty --class"
