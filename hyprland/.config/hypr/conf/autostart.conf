# exec-once = printf "[D-BUS Service]\nName=org.kde.kded6\nExec=/bin/false" > $HOME/.local/share/dbus-1/services/org.kde.kded6.service
# exec-shutdown = rm $HOME/.local/share/dbus-1/services/org.kde.kded6.service
# Setup XDG for screen sharing and start waypaper and waybar
# exec-once = ~/.config/hypr/scripts/xdg.sh
# Export Wayland env to D-Bus/systemd (replaces dbus-update-activation-environment)
envd = WAYLAND_DISPLAY,${WAYLAND_DISPLAY}
envd = XDG_CURRENT_DESKTOP,Hyprland

# Load Wallpaper
# exec-once = hyprpaper
exec-once = mkdir -p ~/.cache/awww ~/.config/hypr/wallust ~/.config/rofi/wallust ~/.config/waybar/wallust ~/.config/swaync/wallust && awww-daemon



# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = systemctl --user start hyprpolkitagent 
# exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/lib/pam_kwallet_init
exec-once = kwalletd6
exec-once = kded6


# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = waybar
exec-once = gnome-keyring-daemon -sd
exec-once = clipse -listen
exec-once = mullvad-vpn --hidden
exec-once = element-desktop --hidden
exec-once = udiskie --automount & # Automatically mount USB drives
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store
# Dark Theme Config
# exec = gsettings set org.gnome.desktop.interface gtk-theme  
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps


# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh

# Dock
exec-once = ~/.config/nwg-dock-hyprland/launch.sh

exec-once = nm-applet --indicator
exec-once = nm-tray   # For ubuntu
exec-once = swaync
#exec-once = ags
exec-once = blueman-applet
# exec-once = qs -c overview  # Quickshell Overview
exec-once = ~/.config/hypr/scripts/Hyprsunset.sh init

# This requires awww-daemon to have finished starting..
exec-once = sleep 5; ~/.config/hypr/scripts/WallpaperAutoChange.sh ~/Pictures/wallpapers/red-theme/
# exec-once = $HOME/.config/hypr/scripts/Dropterminal.sh ghostty &
