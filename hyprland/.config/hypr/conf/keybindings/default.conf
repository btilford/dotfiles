# ---------------------------------------------------- 


# Key bindings
# name: "Default"
# ----------------------------------------------------- 

# Hack
bind = SUPER, KEY, exec,,
# Applications
bind = Super_L, RETURN, exec,/usr/bin/ghostty 
bind = Super_L, B, exec, /usr/bin/brave
bind = Super_L CTRL, E, exec, /usr/bin/smile
bind = Super_L CTRL, C, exec, /usr/bin/speedcrunch

# Windows
bind = Super_L, Q, killactive # Kill active window
bind = Super_R, Q, killactive # Kill active window
bind = Super_L SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:'| xargs kill # Quit active window and all open instances
bind = Super_R SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:'| xargs kill # Quit active window and all open instances
bind = Super_L, F, fullscreen, 0 # Set active window to fullscreen
bind = Super_R, M, fullscreen, 1 # Maximize Window
bind = Super_L, T, exec, hyprctl --batch "dispatch togglefloating; dispatch centerwindow 1"# Toggle active e windows into floating mode
bind = Super_L, C, exec, hyprctl --batch "dispatch centerwindow 1"# Toggle active e windows into floating mode
bind = Super_L SHIFT, T, workspaceopt, allfloat # Toggle all windows into floating mode
bind = Super_L, S, layoutmsg, togglesplit # Toggle split

bind = Super_L, G, togglegroup # Toggle window group
bind = Super_L, D, layoutmsg, swapsplit right # Swapsplit

bind = Super_L, h, movefocus, l # Move focus left
bind = Super_L, l, movefocus, r # Move focus right
bind = Super_L, k, movefocus, u # Move focus up
bind = Super_L, j, movefocus, d # Move focus down
bindm = Super_L, mouse:272, movewindow # Move window with the mouse
bindm = Super_L, mouse:273, resizewindow # Resi eze window with the mouse
bind = Super_L CTRL, h, movewindow, l
bind = Super_L CTRL, j, movewindow, d
bind = Super_L CTRL, k, movewindow, u
bind = Super_L CTRL, l, movewindow, r
# Hyprland 0.54.0 changed so movewindow doesn't cross workspaces. Workspaces
# are not part of a directional coordinate system now and follow indexes
bind = Super_L ALT, h, movetoworkspace, -1
bind = Super_L ALT, j, movetoworkspace, 2
bind = Super_L ALT, k, movetoworkspace, 1
bind = Super_L ALT, l, movetoworkspace, +1

bind = Super_L SHIFT, l, resizeactive, 100 0 # Increase window width with keyboard
bind = Super_L SHIFT, h, resizeactive, -100 0 # Reduce window width with keyboard
bind = Super_L SHIFT, j, resizeactive, 0 100 # Increase window height with keyboard
bind = Super_L SHIFT, k, resizeactive, 0 -100 # Reduce window height with keyboard

# Actions
bind = Super_L CTRL, RETURN, exec, pkill rofi || rofi -show drun -replace -i # Open application launcher
bind = Super_L, r, exec, pkill rofi || rofi -show drun -replace -i # Open application launcher
bind = Super_L SHIFT, B, exec, ~/.config/waybar/launch.sh # Reload waybar
# bind = Super_L CTRL, B, exec, ~/.config/waybar/toggle.sh # Toggle waybar
bind = Super_L, Z, exec, missioncenter # Open Mission Center

# Workspaces
bind = Super_R, 1, workspace, 1 # Open workspace 1
bind = Super_R, 2, workspace, 2 # Open workspace 2
bind = Super_R, 3, workspace, 3 # Open workspace 3
bind = Super_R, 4, workspace, 4 # Open workspace 4
bind = Super_R, 5, workspace, 5 # Open workspace 5
bind = Super_R, 6, workspace, 6 # Open workspace 6
bind = Super_R, 7, workspace, 7 # Open workspace 7
bind = Super_R, 8, workspace, 8 # Open workspace 8
bind = Super_R, 9, workspace, 9 # Open workspace 9
bind = Super_R, 0, workspace, 10 # Open workspace 10

bind = Super_R CTRL, x, movetoworkspace, 1 # Move active window to workspace 1
bind = Super_R CTRL, c, movetoworkspace, 2 # Move active window to workspace 2
bind = Super_R CTRL, v, movetoworkspace, 3 # Move active window to workspace 3
bind = Super_R CTRL, s, movetoworkspace, 4 # Move active window to workspace 4
bind = Super_R CTRL, d, movetoworkspace, 5 # Move active window to workspace 5
bind = Super_R CTRL, f, movetoworkspace, 6 # Move active window to workspace 6
bind = Super_R CTRL, w, movetoworkspace, 7 # Move active window to workspace 7
bind = Super_R CTRL, e, movetoworkspace, 8 # Move active window to workspace 8
bind = Super_R CTRL, r, movetoworkspace, 9 # Move active window to workspace 9
bind = Super_R CTRL, b, movetoworkspace, 10 # Move active window to workspace 10

bind = Super_R, Tab, workspace, m+1 # Open next workspace
bind = Super_R SHIFT, Tab, workspace, m-1 # Open previous workspace

bind = Super_L, mouse_down, workspace, e+1 # Open next workspace
bind = Super_L, mouse_up, workspace, e-1 # Open previous workspace
bind = Super_L CTRL, down, workspace, empty # Open the next empty workspace

# Passthrough SUPER KEY to Virtual Machine
# bind = $mainMod, P, submap, passthru # Passthrough SUPER key to virtual machine
# submap = passthru
# bind = SUPER, Escape, submap, reset # Get SUPER key back from virtual machine
# submap = reset

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Reduce brightness by 10%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% # Increase volume by 5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% # Reduce volume by 5%
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause # Audio pause
bind = , XF86AudioNext, exec, playerctl next # Audio next
bind = , XF86AudioPrev, exec, playerctl previous # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle # Toggle microphone
# bind = CTRL_ALT S, XF86Calculator, exec,  /usr/bin/speedcrunch
# bind = CTRL_ALT L, XF86Lock, exec, hyprctl dispatch lock # Open screenlock
# bind = CTRL_ALT L, XF86Lock, exec, hyprlock # Open screenlock

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10- 


# Clipboard
bind = CTRL_ALT, V, exec, ghostty --class=app.clipse --window-padding-x=10,10 --confirm-close-surface=false -e clipse

bind = Super_L, E, exec, ghostty --class=app.filemanager --window-padding-x=10,10 --confirm-close-surface=false -e yazi

# bind = ,F12, exec, ghostty --class=app.floatterm --window-padding-x=10,10 --confirm-close-surface=false
