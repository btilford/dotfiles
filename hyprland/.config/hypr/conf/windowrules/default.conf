# Yazi
windowrule {
    name = Yazi
    match:initial_class = app.filemanager
    float = on
    size = (1400) (monitor_h * 0.80)
    rounding = 20
    dim_around = on
    decorate = on
    no_blur = off
    no_dim = on
    no_shadow = off
    no_screen_share = off
    xray = on

    # stayfocused = on
    # noshadow = off
    # noboarder = on
# windowrulev2 = float, size 1000 652, class:(app.filemanager)
# # windowrulev2 = , class:(app.filemanager)
# windowrulev2 = stayfocused, class:(app.filemanager)
# windowrulev2 = noshadow, class:(app.filemanager)
# windowrulev2 = noborder, class:(app.filemanager)

}

windowrule {
    # Clipboard
    name = Clipboard
    match:initial_class = app.clipse
    float = on
    center = on
    size = (1200) (monitor_h * 0.80)
    opacity = 0.95 0.55 0.55
    # animation = style opt
    border_size = 2
    rounding = 50
    dim_around = on
    decorate = off
    no_blur = on
    no_dim = on
    no_shadow = on
    no_screen_share = on
    xray = on
