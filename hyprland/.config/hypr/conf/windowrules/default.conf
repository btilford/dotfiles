# layerrule = unset,blur, namespace:waybar
# layerrule = ignorealpha 0, namespace:waybar
# layerrule = xray on, namespace:waybar
windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

layerrule {
    name = Rofi
    match:namespace = rofi
    dim_around = on
    no_screen_share = off
    xray = on
    blur = on
    ignore_alpha = 0
    # ignore_zero = 0
}

# -----------------------------------------------------
# SwayNC notification center — treat as overlay so
# notifications don't cause tiling windows to shift
# -----------------------------------------------------
layerrule {
    name = swaync-notifications
    match:namespace = swaync-notification-window
    xray = on
}

layerrule {
    name = swaync-center
    match:namespace = swaync-control-center
    blur = on
    xray = off
    ignore_alpha = 0.3
}
