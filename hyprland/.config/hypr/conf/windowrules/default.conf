# ----------------------------------------------------- 
# Window rules
# ----------------------------------------------------- 

windowrule {
    # Prevent apps (especially Chromium-based browsers) from entering
    # maximized mode when exiting fullscreen, so tiled windows return
    # to their normal tiled state instead of covering other tiles.
    name = "Suppress maximize events"
    match:class = .*
    suppress_event = maximize
}

windowrule = match:focus 0, border_size 0

# Generic Floating window like browser file chooser
windowrule {
    name = "Brave Dialogs"
    # match:class = brave
    match:title = ^(Save\sFile|Open\sFile|All\sFiles)$
    float = on


# windowrulev2 = float, title:^(Save\sFile|Open\sFile)$, class:brave
}

windowrule {
    name = "Floaters"
    match:class = ^(pavucontrol|blueman-manager|nm-connection-editor|qalculate-gtk|Picture-in-Picture|[Ww]logout)$
    float = on

