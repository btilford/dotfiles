# ----------------------------------------------------- 
# General window layout and colors
# name: "Default"
# ----------------------------------------------------- 

general {
    # name = Default
    gaps_in = 8
    gaps_out = 4
    float_gaps = 4
    gaps_workspaces = 4
    # border_size = 5
    border_size = 0
    # col.active_border = rgba(99ff77cc)
    # col.inactive_border = rgba(ff442266)
    col.active_border = rgba(ff881186)
    col.nogroup_border = rgba(88ff1177)
    # layout = master
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = true
    hover_icon_on_border = true

    snap {
        enabled = true
        respect_gaps = true
    }
}


