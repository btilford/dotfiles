# ----------------------------------------------------- 
# Keyboard Layout
# https://wiki.hyprland.org/Configuring/Variables/#input
# -----------------------------------------------------

#
# gestures {
#     workspace_swipe = true
# }

input {
    kb_layout = us
    kb_variant = ,qwerty

    numlock_by_default = true
    sensitivity = 1.0
    accel_profile = adaptive
    follow_mouse = 1
    follow_mouse_threshold = 1.0
    focus_on_close = 1
    mouse_refocus = false
    float_switch_override_focus = 2
    
    touchpad {
        disable_while_typing = true
        drag_lock = true
    }

    tablet {
        output = desc: UGD MD180UH
    

    }
    
}

device {
    name = crosses-bt-mouse
    accel_profile = flat
    sensitivity = 1.0
    # scroll_points = 
    scroll_factor = 0.5
}
device {
    name = crosses-bt-keyboard
}

device {
    name = logitech-g502-1
    accel_profile = adaptive
    sensitivity = 1.0

}
