general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms off; sleep 0.5; hyprctl dispatch dpms on; sleep 1; pgrep awww-daemon || (mkdir -p ~/.cache/awww && awww-daemon &)
}

# Screenlock after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# DPMS off after 11 minutes (1 min after lock)
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms off; sleep 0.5; hyprctl dispatch dpms on
}

# Suspend after 30 minutes — uncomment to enable
listener {
    timeout = 1800
    on-timeout = systemctl suspend
    # on-timeout = ""
}
