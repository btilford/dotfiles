general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("off")'; sleep 2; hyprctl dispatch 'hl.dsp.dpms("on")'; sleep 1; pgrep awww-daemon || (mkdir -p ~/.cache/awww && awww-daemon &)
}

# Screenlock after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# DPMS off after 11 minutes (1 min after lock)
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    # Plain "on". The old "off; sleep 0.5; on" left every output OFF (tested
    # 2026-11-26): an off-then-on 0.5 s apart loses the "on".
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Suspend after 30 minutes — uncomment to enable
listener {
    timeout = 1800
    on-timeout = systemctl suspend
    # on-timeout = ""
}
