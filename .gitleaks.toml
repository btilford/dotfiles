title = "dotfiles gitleaks config"

# Inherit gitleaks' full default rule set, then narrow with allowlists below.
[extend]
useDefault = true

# Custom rules. Each of these caught a secret that the default rule set scanned
# straight past — all three were committed here and reported clean by
# `gitleaks git .` across the full history. Do not remove without a replacement.

[[rules]]
id = "npmrc-authtoken"
description = "npm registry _authToken (Nexus/Artifactory/npmjs)"
regex = '''_authToken\s*=\s*\S+'''

[[rules]]
id = "google-app-password"
description = "Google app password — four lowercase 4-char groups"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*["']?[a-z]{4}( [a-z]{4}){3}["']?'''

[[rules]]
id = "bare-secret-export"
description = "export SECRET=/PASSWORD=/TOKEN= with a literal value"
# The [^"'$] guard permits `export SECRET="$FROM_ENV"` and catches literals.
regex = '''export\s+(SECRET|PASSWORD|TOKEN|API_KEY)\s*=\s*["'][^"'$][^"']*["']'''

[[allowlists]]
description = "GPG signing-key IDs/fingerprints are public, not secrets"
regexTarget = "line"
regexes = ['''signingKey\s*=\s*[0-9A-Fa-f]{40}''']

# NO `paths` allowlists here, deliberately. A path allowlist matches on file path
# in EVERY scan mode — `gitleaks git` (history) as well as `gitleaks dir`
# (working tree) — so allowlisting a path to silence an untracked live config also
# blinds the gate to every SECRET THAT FILE ONCE CONTAINED IN HISTORY. That is
# exactly what happened: `glab-cli/config.yml`, `docker/mcp/config.yaml` and
# `base/.npmrc` were path-allowlisted, and a full-history scan read clean while
# five GitLab PATs, a Nexus admin token and a Google app password sat in the log.
#
# The untracked-live-config problem those allowlists solved is now handled at the
# SCAN boundary instead: `mise run lint:secrets` scans TRACKED content only (via
# `git archive HEAD`), so untracked provisioned files are never seen and need no
# allowlist. History scans therefore see everything, honestly.
