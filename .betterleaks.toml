title = "dotfiles betterleaks config"

# Inherit betterleaks' full default rule set, then narrow with allowlists below.
[extend]
useDefault = true

# Custom rules. Each of these caught a secret that the default rule set scanned
# straight past — all three were committed here and reported clean by a full
# history scan with `gitleaks git .`, the scanner in use at the time. Do not
# remove without a replacement.

[[rules]]
id = "npmrc-authtoken"
description = "npm registry _authToken (Nexus/Artifactory/npmjs)"
regex = '''_authToken\s*=\s*\S+'''

[[rules]]
id = "google-app-password"
description = "Google app password — four lowercase 4-char groups"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*["']?[a-z]{4}( [a-z]{4}){3}["']?'''

[[rules]]
id = "bare-secret-export"
description = "export SECRET=/PASSWORD=/TOKEN= with a literal value"
# The [^"'$] guard permits `export SECRET="$FROM_ENV"` and catches literals.
regex = '''export\s+(SECRET|PASSWORD|TOKEN|API_KEY)\s*=\s*["'][^"'$][^"']*["']'''

# Structured-config credentials — a JSON/JSONC key whose name says "secret" and
# whose value is a literal. This is the shape an MCP server's `env` block takes,
# and the default rule set plus all three rules above scan straight past it: a
# real UniFi controller password sat in `opencode/.config/opencode/opencode.json`
# from 2026-05-21 to 2026-06-06 and is STILL in history, through a full
# `filter-repo` rewrite that was verified with `gitleaks git` and reported clean.
# `bare-secret-export` does not cover it because nothing is exported — the value
# is a JSON string.
#
# The leading [^"$<{] on the value is what keeps this quiet: it admits
# "${FROM_ENV}", "$VAR", "<your-token-here>" and "{{template}}" — the placeholder
# forms every `.example` file in this repo uses — and rejects a literal. The
# {8,} floor keeps short sentinels like "changeme" and "none" out.
[[rules]]
id = "json-credential-value"
description = "JSON/JSONC credential key with a literal value (MCP env blocks, app configs)"
regex = '''(?i)"[A-Za-z0-9_-]*(?:password|passwd|secret|token|api_?key|credential)[A-Za-z0-9_-]*"\s*:\s*"([^"$<{][^"]{7,})"'''
# The capture group is the VALUE, and secretGroup points at it. Without this the
# reported (and --redact-ed) secret is the whole `"key": "value"` match, which
# both leaks the key name into a redacted report and makes fingerprints noisier.
secretGroup = 1
# Cheap pre-filter: betterleaks only runs the regex on a chunk containing one of
# these, and the regex cannot match without one anyway.
keywords = [
  "password",
  "passwd",
  "secret",
  "token",
  "api_key",
  "apikey",
  "credential",
]


# Same shape in YAML, where the key is unquoted. `docker/.docker/mcp/config.yaml`
# is exactly this and once held a live Google app password. Unquoted values are
# matched too, so `password: hunter2` is caught, but a bare `${VAR}`, `<...>`,
# `{{...}}`, `*anchor` or an empty value is not.
#
# The whitespace classes are `[ \t]`, never `\s`: `\s` matches a newline, so
# `\s*:\s*` let an empty `api_key:` borrow the VALUE OFF THE NEXT LINE and report
# the innocent key below it. Caught by a fixture that was supposed to be clean.
[[rules]]
id = "yaml-credential-value"
description = "YAML credential key with a literal value"
# The value may not contain `(){};,`: an unquoted YAML scalar and a line of
# JavaScript are the same shape to a regex, and
# `claude-code/.claude/hooks/caveman-stats.js` produced four findings on lines
# like `output_tokens: parsed.outputTokens,`. A real secret containing a brace, a
# semicolon or a comma is possible but rare; a line of code with none of the
# three is rarer still — the object literal's trailing comma is what catches it.
regex = '''(?im)^[ \t]*[A-Za-z0-9_-]*(?:password|passwd|secret|token|api_?key|credential)[A-Za-z0-9_-]*[ \t]*:[ \t]*["']?([^"'$<{*&\s(){};,][^"'\n(){};,]{7,})["']?[ \t]*$'''
secretGroup = 1
keywords = [
  "password",
  "passwd",
  "secret",
  "token",
  "api_key",
  "apikey",
  "credential",
]


# One allowlist, both rules. `targetRules` (v8.25+) scopes a top-level allowlist
# to named rules instead of applying globally — which is what makes it safe to
# write these exemptions once instead of keeping two copies of them in step.
# Everything here is a REFERENCE or a placeholder: literal in form, carrying no
# credential. Every entry is a real line in this repo.
[[allowlists]]
description = "structured-config placeholders and indirection, not values"
targetRules = ["json-credential-value", "yaml-credential-value"]
regexTarget = "match"
regexes = [
  # "!printenv PI_API_KEY" — pi-agent resolves the value by running the command
  '''"\s*:\s*"!''',
  ''':[ \t]*["']?!''',
  # op:// (1Password), infisical://, vault:// — reference syntaxes, not secrets
  '''"\s*:\s*"(op|infisical|vault|keyring|secret)://''',
  ''':[ \t]*["']?(op|infisical|vault|keyring|secret)://''',
  # YOUR_API_KEY_HERE and friends
  '''(?i)"\s*:\s*"(your|my)[_ -]?[a-z0-9_ -]*(key|token|secret|password)[_ -]?(here)?"''',
  '''(?i):[ \t]*["']?(your|my)[_ -]?[a-z0-9_ -]*(key|token|secret|password)[_ -]?(here)?["']?[ \t]*$''',
  # changeme / placeholder / redacted / xxxx
  '''(?i)"\s*:\s*"(change[_-]?me|replace[_-]?me|example|placeholder|redacted|todo|none|null|x{4,})"''',
  '''(?i):[ \t]*["']?(change[_-]?me|replace[_-]?me|example|placeholder|redacted|todo|none|null|x{4,})["']?[ \t]*$''',
  # A bare SCREAMING_SNAKE value is a variable's NAME, not its value —
  # `"token": "HOME_ASSISTANT_TOKEN"` in weather.example.json, and the
  # deliberately-absent `"NO_SUCH_SECRET"` fixture in visual-capture.sh.
  '''"\s*:\s*"[A-Z][A-Z0-9_]{3,}"''',
  ''':[ \t]*["']?[A-Z][A-Z0-9_]{3,}["']?[ \t]*$''',
]
# Second layer, matched against the captured VALUE (secretGroup) rather than the
# whole line. Deliberately short: a stopword is a substring test, so listing
# "password" here would silently exempt a real value that contains it.
stopwords = ["changeme", "placeholder", "redacted", "yourtokenhere", "xxxxxxxx"]

[[allowlists]]
description = "filter-repo redaction marker — a scrubbed secret, never a real one"
regexTarget = "line"
regexes = ['''\*\*\*REMOVED\*\*\*''']

[[allowlists]]
description = "GPG signing-key IDs/fingerprints are public, not secrets"
regexTarget = "line"
regexes = ['''signingKey\s*=\s*[0-9A-Fa-f]{40}''']

# NO `paths` allowlists here, deliberately. A path allowlist matches on file path
# in EVERY scan mode — `betterleaks git` (history) as well as `betterleaks dir`
# (working tree) — so allowlisting a path to silence an untracked live config also
# blinds the gate to every SECRET THAT FILE ONCE CONTAINED IN HISTORY. That is
# exactly what happened: `glab-cli/config.yml`, `docker/mcp/config.yaml` and
# `base/.npmrc` were path-allowlisted, and a full-history scan read clean while
# five GitLab PATs, a Nexus admin token and a Google app password sat in the log.
#
# The untracked-live-config problem those allowlists solved is now handled at the
# SCAN boundary instead: `mise run lint:secrets` scans TRACKED content only (via
# `git archive HEAD`), so untracked provisioned files are never seen and need no
# allowlist. History scans therefore see everything, honestly.
